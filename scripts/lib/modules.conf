# scripts/lib/modules.conf — 로컬 실행 스크립트의 모듈·포트 카탈로그 (단일 원본)
#
# 읽는 쪽:
#   sh  : scripts/lib/modules.sh   → be-run.sh(모듈 목록·포트·로그 색), fe-run.sh·local-run.sh(포털 포트)
#   ps1 : scripts/lib/modules.ps1  → be-run.ps1·fe-run.ps1·dmes-up.ps1·dmes-down.ps1·local-run.ps1
# 형식: 한 줄에 한 항목, 칸은 공백으로 나눈다. '#' 로 시작하는 줄과 빈 줄은 건너뛴다. 항목 줄은 ASCII 만 쓴다.
#   kind      be(백엔드 Spring Boot 모듈) 또는 portal(프론트 포털 dev 서버)
#   name      모듈 이름 — be-run 의 --<name> 플래그, src/backend/<name> 폴더, 로그 태그 be-<name>
#   port      local 프로파일 포트
#   color     로그 태그 색: green blue magenta cyan yellow red dim (- 는 기본 청록)
#   platforms 이 항목을 쓰는 쪽: sh, ps1 (쉼표로 여럿)
# be 줄의 순서가 --all 의 기동 순서다.
# mdm 은 아직 sh 전용이다 — be-run.ps1 에 mdm 샘플 데이터 인자(MDM_SAMPLE)가 없고 Windows 에서 확인한 적이 없어
# ps1 의 --all 에 넣지 않았다(종전 ps1 동작 유지). Windows 에서 확인한 뒤 platforms 에 ps1 을 더한다.
# 그때 local-run.ps1 의 $feAllowed 에 --mdm·--mdm-only 를 넣을지(fe-run.ps1 이 받는지) 먼저 정한다.
#
# kind    name    port   color    platforms
be        mls     8092   cyan     sh,ps1
be        mqc     8093   yellow   sh,ps1
be        mpp     8094   green    sh,ps1
be        mpn     8095   magenta  sh,ps1
be        mdm     8096   red      sh
be        mcm     8100   blue     sh,ps1
be        analog  8191   dim      sh,ps1
portal    mcm     5100   -        sh,ps1
