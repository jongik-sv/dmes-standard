plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'com.dongkuk.dmes'
version = libs.versions.cactus.core.get()

repositories {
    // 공개 의존(Boot/Jackson/MapStruct/POI/JJWT 등)은 mavenCentral 에서 직접 — 사내망 미접속에도 영향 없음
    mavenCentral()
    // TODO(2026-05-15): 사내 Nexus 연결 불안정으로 주석 처리.
    // oasis-core 는 src/backend/oasis (subtree) 의 로컬 모듈 의존성으로 전환.
    // 사내 라이브러리 참조가 필요하면 CI/사내망에서만 별도 프로파일로 활성화.
    // maven {
    //     url = 'http://172.31.1.96:8889/nexus/content/groups/public'
    //     allowInsecureProtocol = true
    //     content {
    //         includeGroup 'com.dongkuk'
    //         includeGroup 'com.dongkuk.dmes'
    //     }
    // }
}

ext {
    springVersion = '7.0.6'
    log4jVersion = '2.24.3'
    jpaVersion = '3.2.0'
    mybatis = '3.5.19'
    mybatisSpring = '3.0.4'
    slf4j = '2.0.16'
    gson = '2.12.1'
    assertj = '3.27.3'
    junit = '5.11.4'
    jackson = '2.18.2'
    springDataJpa = '4.0.4'
    hikari = '6.2.1'
    hibernate = '7.0.5.Final'
    jsr305 = '3.0.2'
    findbugs = '3.0.1'
}

subprojects {
    group = 'com.dongkuk'
    version = '5.1.0'

    repositories {
        mavenLocal()
        mavenCentral()
        maven {
            url = uri('https://jitpack.io')
        }
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.add('-parameters')
}

tasks.named('test') {
    useJUnitPlatform()
}

dependencies {
    // ── OASIS (로컬 모듈) ──
    api project(':oasis-core')

    // ── Spring Boot ──
    api platform(libs.spring.boot.dependencies)
    api libs.spring.boot.autoconfigure
    compileOnly libs.spring.web
    compileOnly libs.spring.webmvc
    compileOnly libs.spring.boot.webmvc
    compileOnly libs.spring.security.core
    compileOnly libs.spring.security.config
    compileOnly libs.spring.security.web
    compileOnly libs.jakarta.servlet.api

    // ── Jackson ──
    api libs.jackson.databind.managed
    api libs.jackson.datatype.jsr310

    // ── MDM 메타 캐시(spec docs/superpowers/specs/2026-10-02-mdm-meta-cache-design.md §5.1, 2026-10-02) ──
    //   업무 모듈이 엔진 spi(DefinitionLookup·CodeLookup)와 검증기를 쓴다. 엔진 main 의존은 EvalEx 하나다.
    //   버전은 POM 에 빠지지 않게 적는다(maven-publish). 소스 빌드는 settings.gradle 의 includeBuild 가 치환한다.
    api libs.maru.mdm.engine.versioned

    // ── JPA (감사 엔티티용) ──
    compileOnly libs.spring.boot.starter.data.jpa

    // ── MyBatis (1.0.22-SNAPSHOT 부터 transitive) ──
    // cactus-mybatis-multi-ds-design.md §5-1 — 본 설계의 multi-DS SqlSessionFactory 자동 등록 +
    // 인터셉터 직접 attach + CactusMultiMyBatisSqlRunner 가 모두 mybatis-spring 의존.
    // mybatis-spring-boot-starter 가 mybatis + mybatis-spring + autoconfigure 한 번에 가져옴.
    api libs.mybatis.spring.boot.starter.v304

    // ── Spring Cache + Caffeine (마스터 코드 LoV 캐시) ──
    // compileOnly 로 두어 소비 모듈이 spring-context-support 를 가져온 경우에만 활성.
    // 대부분의 *core 모듈이 spring-boot-starter-web 등을 통해 transitively 가져감.
    compileOnly libs.spring.context.support
    compileOnly libs.caffeine.managed

    // ── JWT ──
    api libs.jjwt.api
    runtimeOnly libs.jjwt.impl
    runtimeOnly libs.jjwt.jackson

    // ── BCrypt ──
    api libs.jbcrypt

    // ── Logging ──
    compileOnly libs.slf4j.api

    // ── Test ──
    testImplementation libs.spring.boot.starter.test
    testImplementation libs.spring.webmvc
    testImplementation libs.mybatis.base
    testImplementation libs.spring.boot.starter.data.jpa
    testImplementation libs.spring.security.core
    testImplementation libs.spring.security.config
    testImplementation libs.spring.security.web
    testImplementation libs.jjwt.impl
    testImplementation libs.jjwt.jackson
    testImplementation libs.jakarta.servlet.api
    testImplementation libs.spring.web
    // 트랜잭션 재현 시험이 cactus-core 에서 SQLite 를 쓴다. 시험 소스는 org.sqlite 를 컴파일 단계에서
    // 참조하지 않으므로 실행 범위로 둔다(다른 모듈과 같은 범위, 버전은 mcm/lib 등과 동일)
    testRuntimeOnly libs.sqlite.jdbc
    // 같은 시험이 hibernate.dialect 를 org.hibernate.community.dialect.SQLiteDialect 문자열로만 지정한다(import 없음)
    // 버전은 BOM 이 관리한다
    testRuntimeOnly libs.hibernate.community.dialects.managed
    testRuntimeOnly libs.junit.platform.launcher
}

// ── Maven Publish ──
def nexusUrl = "http://172.31.1.96:8889/nexus"
def nexusUsername = 'admin'
def nexusPassword = 'admin123'

publishing {
    repositories {
        maven {
            name = "Snapshots"
            url = "${nexusUrl}/content/repositories/snapshots/"
            credentials {
                username = "${nexusUsername}"
                password = "${nexusPassword}"
            }
            allowInsecureProtocol = true
        }
    }
    publications {
        mavenJava(MavenPublication) {
            artifactId = project.name
            from components.java
        }
    }
}

// ── 빌드 부하·속도 설정(chore/gradle-tuning, 2026-09-26) — 모든 Test 태스크 공통 ──
// - 빌드 캐시(gradle.properties org.gradle.caching=true)에서 Test 를 뺀다. 테스트가 선언되지 않은 외부 입력에 기댄다 —
//   작업 트리 밖 파일(mdm: frontend messages.ts·mcm DataInitializer·maru-mdm-engine 코퍼스), 기본 application.yml 의
//   상태 있는 ../data/*.db, BACKEND_CLIENT_KEY 환경 변수. 캐시가 다른 워크트리의 통과 결과를 꺼내 실패를 숨길 수 있다.
//   컴파일 등 다른 태스크는 그대로 캐시한다. 루트 composite 에서 켠 캐시는 모든 includeBuild 에 적용되므로 모듈마다 둔다.
// - 테스트 JVM 은 짧게 돌아 C2 JIT 컴파일이 CPU 만 먹고(측정 시 350% 가까이) 이득이 없다 — C1 까지만 쓴다.
allprojects {
    tasks.withType(Test).configureEach {
        outputs.doNotCacheIf('선언되지 않은 외부 입력(작업 트리 밖 파일·../data SQLite·환경 변수)에 기대는 테스트') { true }
        // C1 만 쓰면 JVM 이 코드 캐시 기본값을 240MB → 48MB 로 줄인다. mdm/api 1060건에서 "Out of space in CodeCache for
        // adapters" 로 OASIS 호출이 실패했다(2026-09-26) — 원래 기본값으로 되돌린다(예약 크기라 쓰는 만큼만 잡힌다).
        jvmArgs '-XX:TieredStopAtLevel=1', '-XX:ReservedCodeCacheSize=240m'
    }
}

// PC 전역 테스트 슬롯 — 같은 PC 에서 동시에 도는 Test 태스크를 DMES_TEST_SLOTS(기본 2)개로 묶는다(../gradle/test-slot.gradle).
apply from: file('../gradle/test-slot.gradle')
