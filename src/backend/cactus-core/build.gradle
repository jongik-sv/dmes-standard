plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'com.dongkuk.dmes'
version = '1.0.22-SNAPSHOT'

repositories {
    // 공개 의존(Boot/Jackson/MapStruct/POI/JJWT 등)은 mavenCentral 에서 직접 — 사내망 미접속에도 영향 없음
    mavenCentral()
    // TODO(2026-05-15): 사내 Nexus 연결 불안정으로 주석 처리.
    // oasis-core 는 src/backend/oasis (subtree) 의 로컬 모듈 의존성으로 전환.
    // 사내 라이브러리 참조가 필요하면 CI/사내망에서만 별도 프로파일로 활성화.
    // maven {
    //     url = 'http://172.31.1.96:8889/nexus/content/groups/public'
    //     allowInsecureProtocol = true
    //     content {
    //         includeGroup 'com.dongkuk'
    //         includeGroup 'com.dongkuk.dmes'
    //     }
    // }
}

ext {
    springVersion = '7.0.6'
    log4jVersion = '2.24.3'
    jpaVersion = '3.2.0'
    mybatis = '3.5.19'
    mybatisSpring = '3.0.4'
    slf4j = '2.0.16'
    gson = '2.12.1'
    assertj = '3.27.3'
    junit = '5.11.4'
    jackson = '2.18.2'
    springDataJpa = '4.0.4'
    hikari = '6.2.1'
    hibernate = '7.0.5.Final'
    jsr305 = '3.0.2'
    findbugs = '3.0.1'
}

subprojects {
    group = 'com.dongkuk'
    version = '5.1.0'

    repositories {
        mavenLocal()
        mavenCentral()
        maven {
            url = uri('https://jitpack.io')
        }
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.add('-parameters')
}

tasks.named('test') {
    useJUnitPlatform()
}

dependencies {
    // ── OASIS (로컬 모듈) ──
    api project(':oasis-core')

    // ── Spring Boot ──
    api platform('org.springframework.boot:spring-boot-dependencies:4.0.6')
    api 'org.springframework.boot:spring-boot-autoconfigure'
    compileOnly 'org.springframework:spring-web'
    compileOnly 'org.springframework:spring-webmvc'
    compileOnly 'org.springframework.boot:spring-boot-webmvc'
    compileOnly 'org.springframework.security:spring-security-core'
    compileOnly 'org.springframework.security:spring-security-config'
    compileOnly 'org.springframework.security:spring-security-web'
    compileOnly 'jakarta.servlet:jakarta.servlet-api'

    // ── Jackson ──
    api 'com.fasterxml.jackson.core:jackson-databind'
    api 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

    // ── JPA (감사 엔티티용) ──
    compileOnly 'org.springframework.boot:spring-boot-starter-data-jpa'

    // ── MyBatis (1.0.22-SNAPSHOT 부터 transitive) ──
    // cactus-mybatis-multi-ds-design.md §5-1 — 본 설계의 multi-DS SqlSessionFactory 자동 등록 +
    // 인터셉터 직접 attach + CactusMultiMyBatisSqlRunner 가 모두 mybatis-spring 의존.
    // mybatis-spring-boot-starter 가 mybatis + mybatis-spring + autoconfigure 한 번에 가져옴.
    api 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.4'

    // ── Spring Cache + Caffeine (마스터 코드 LoV 캐시) ──
    // compileOnly 로 두어 소비 모듈이 spring-context-support 를 가져온 경우에만 활성.
    // 대부분의 *core 모듈이 spring-boot-starter-web 등을 통해 transitively 가져감.
    compileOnly 'org.springframework:spring-context-support'
    compileOnly 'com.github.ben-manes.caffeine:caffeine'

    // ── JWT ──
    api 'io.jsonwebtoken:jjwt-api:0.12.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.5'

    // ── BCrypt ──
    api 'org.mindrot:jbcrypt:0.4'

    // ── Logging ──
    compileOnly 'org.slf4j:slf4j-api'

    // ── Test ──
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework:spring-webmvc'
    testImplementation 'org.mybatis:mybatis:3.5.16'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    testImplementation 'org.springframework.security:spring-security-core'
    testImplementation 'org.springframework.security:spring-security-config'
    testImplementation 'org.springframework.security:spring-security-web'
    testImplementation 'io.jsonwebtoken:jjwt-impl:0.12.5'
    testImplementation 'io.jsonwebtoken:jjwt-jackson:0.12.5'
    testImplementation 'jakarta.servlet:jakarta.servlet-api'
    testImplementation 'org.springframework:spring-web'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// ── Maven Publish ──
def nexusUrl = "http://172.31.1.96:8889/nexus"
def nexusUsername = 'admin'
def nexusPassword = 'admin123'

publishing {
    repositories {
        maven {
            name = "Snapshots"
            url = "${nexusUrl}/content/repositories/snapshots/"
            credentials {
                username = "${nexusUsername}"
                password = "${nexusPassword}"
            }
            allowInsecureProtocol = true
        }
    }
    publications {
        mavenJava(MavenPublication) {
            artifactId = project.name
            from components.java
        }
    }
}
