plugins {
    id 'java-library'
    id 'maven-publish'
    id 'dmes.test-conventions'
}

group = 'com.dongkuk.dmes'
version = '0.1.0-SNAPSHOT'

repositories {
    mavenCentral()
    // 사내 전용 라이브러리 저장소가 있다면 여기에 추가
    // maven {
    //     url = 'https://your-internal-nexus/repository/maven-public/'
    //     content {
    //         includeGroup 'com.dongkuk'
    //         includeGroup 'com.dongkuk.dmes'
    //     }
    // }
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.add('-parameters')
}

tasks.named('test') {
    useJUnitPlatform()
    // ScreenUsageOasisContractTest·ScreenUsageMssqlDdlTest 가 mcm/api 시드 소스를 작업 디렉터리 기준 상대 경로로 직접 읽는다 — 입력으로 선언한다.
    inputs.files(rootProject.file('../mcm/api/src/main/java/com/dongkuk/dmes/mcm/init/seed/CoreRbacSeeder.java'),
                rootProject.file('../mcm/api/src/main/java/com/dongkuk/dmes/mcm/init/seed/ScreenUsageSchemaArtifacts.java'),
                rootProject.file('../mcm/api/src/main/java/com/dongkuk/dmes/mcm/init/DataInitializer.java'))
            .withPropertyName('mcmSeedSources').withPathSensitivity(PathSensitivity.RELATIVE)
    // ScreenUsageOasisContractTest — mcm/api 의 BPMN 2개를 SERVICES.resolve 로 직접 읽는다(디렉터리 walk 없음)
    inputs.files(rootProject.file('../mcm/api/src/main/resources/services/audit/screenUsage.bpmn'),
                rootProject.file('../mcm/api/src/main/resources/services/csa/screenUsageStat.bpmn'))
            .withPropertyName('mcmScreenUsageBpmn').withPathSensitivity(PathSensitivity.RELATIVE)
}

dependencies {
    api platform(libs.spring.boot.dependencies)

    // 런타임 빈은 이 라이브러리를 사용하는 호스트 모듈(cactus-core 등)이 제공한다.
    compileOnly libs.spring.boot.starter.data.jpa
    compileOnly libs.spring.boot.starter.webmvc
    compileOnly libs.spring.boot.starter.security
    compileOnly libs.spring.boot.starter.validation
    // Spring Boot 4 에서 spring-boot-starter-aop 은 spring-boot-starter-aspectj 로 개명됐다.
    compileOnly libs.spring.boot.starter.aspectj
    compileOnly libs.aspectjweaver

    // JPA + MyBatis 혼용 패턴
    compileOnly libs.mybatis.spring.boot.starter.v304

    api libs.jackson.databind.managed
    api libs.jackson.datatype.jsr310

    compileOnly libs.flyway.core

    annotationProcessor platform(libs.spring.boot.dependencies)
    compileOnly libs.lombok.base
    annotationProcessor libs.lombok.base

    testImplementation libs.spring.boot.starter.test
    testImplementation libs.spring.boot.starter.data.jpa
    testImplementation libs.spring.boot.starter.webmvc
    testImplementation libs.spring.boot.starter.security
    testImplementation libs.spring.boot.starter.validation
    testImplementation libs.spring.security.test
    testImplementation libs.archunit.junit5
    testImplementation libs.flyway.core
    testRuntimeOnly libs.h2
    // 쿼리 위젯 실행기 읽기 전용 강제(PRAGMA query_only·풀 연결 복원) 시험 — 로컬 실행 DB 와 같은 드라이버(aps-core 와 같은 판)
    testRuntimeOnly libs.sqlite.jdbc
    testRuntimeOnly libs.flyway.database.postgresql
    testRuntimeOnly libs.junit.platform.launcher
}

