plugins {
    id 'java'
    id 'dmes.test-conventions'
}

// 하위 프로젝트마다 사소한 JUnit 시험 하나. dmes.test-conventions 의 allprojects 배선(차례·마무리 태스크)이 각 :sN:test 에 붙는다.
subprojects {
    apply plugin: 'java'
    repositories { mavenCentral() }
    dependencies {
        testImplementation platform('org.junit:junit-bom:5.11.4')
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }
    tasks.withType(Test).configureEach { useJUnitPlatform() }
}

// releaseTurn 멱등·소유자 구분 확인(Oracle 접속 없음). 실행: gradlew probeRelease — run-seq.sh 가 Oracle 모드 없이 쓰지 않으므로 -Pdmes.ora.pdb 를 준다.
tasks.register('probeRelease') {
    doLast {
        def svc = gradle.sharedServices.registrations.getByName('dmesOraTestPdb').service.get()
        def owner = { System.getProperty(OraTestPdbService.TURN_OWNER) }
        svc.acquireTurn('k1', 1000L)
        assert owner() == 'k1'
        svc.releaseTurn('k2')              // 쥐지 않은 키는 아무것도 바꾸지 않는다
        assert owner() == 'k1'
        svc.releaseTurn('k1')
        assert owner() == null
        svc.releaseTurn('k1')              // 두 번 불러도 안전하다
        assert owner() == null
        svc.acquireTurn('k3', 1000L)       // 놓은 뒤 다른 키가 곧바로 받는다
        assert owner() == 'k3'
        svc.close()                        // 비정상 종료로 놓지 못한 차례는 서비스 close 가 푼다(turnsHeld)
        assert owner() == null
        println 'PROBE-RELEASE ok'
    }
}

// 상위가 쥔 PC 잠금 인정(adoptParentLock) 확인 — ../run-lockheld.sh 가 환경변수·잠금을 준비하고 PROBE_EXPECT 로 기대(adopt|own)를 준다.
tasks.register('probeLockHeld') {
    doLast {
        def svc = gradle.sharedServices.registrations.getByName('dmesOraTestPdb').service.get()
        String expect = System.getenv('PROBE_EXPECT')
        // 잠금 폴더는 node 의 os.tmpdir() 기준이다. macOS 의 JVM 은 TMPDIR 를 무시하므로(java.io.tmpdir 이 달라진다) 환경변수 TMPDIR 를 먼저 본다.
        File owner = new File(System.getenv('TMPDIR') ?: System.getProperty('java.io.tmpdir'), 'dmes-ora-pdb.lock/owner')
        svc.holdPcLock()
        if (expect == 'adopt') {
            long held = System.getenv('DMES_ORA_LOCK_HELD') as long
            assert svc.lockHolder == null : 'adopt 인데 lock-hold 를 따로 띄웠다'
            assert svc.lockPid == held
            svc.releasePcLock()                     // 주인이 아니므로 놓지 않는다
            assert owner.isFile() && owner.text.startsWith("${held} ") : '상위 잠금이 사라졌다'
        } else {
            assert svc.lockHolder != null : 'own 인데 직접 잠금을 잡지 않았다'
            assert owner.isFile() && owner.text.startsWith("${svc.lockPid} ")
            svc.releasePcLock()
            assert !owner.isFile() : '직접 잡은 잠금을 놓지 않았다'
        }
        println "PROBE-LOCKHELD ${expect} ok"
    }
}
