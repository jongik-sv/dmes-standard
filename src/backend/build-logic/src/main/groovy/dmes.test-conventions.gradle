// dmes.test-conventions — 백엔드 모듈 공통 Test 관례(빌드 캐시 제외·JIT 설정, ③ build-logic, 2026-10-04 에 모듈 루트 build.gradle 끝에서 옮겼다).
// 모듈 루트 build.gradle 의 plugins { … id 'dmes.test-conventions' } 로 루트 프로젝트에만 한 번 적용한다. 아래 allprojects
// 가 그 빌드의 모든 프로젝트(하위 lib·api, cactus-core 가 끌어오는 oasis-core·oasis-core-api 포함)의 Test 에 건다.
// PC 전역 테스트 슬롯은 여기서 걸지 않는다 — 모듈 루트 build.gradle 끝의 apply from: file('../gradle/test-slot.gradle') 가 건다.
// precompiled script plugin 안의 apply from 은 Gradle 9.3.1 에서 구성 단계에 "No service of type ClassLoaderScope available
// in project services" 로 실패하고, test-slot.gradle 은 analog 와 함께 쓰는 단일 구현이라 그 파일을 그대로 apply 한다.
if (project != rootProject) {
    throw new GradleException("dmes.test-conventions 는 모듈 루트 프로젝트에만 적용한다(${project.path} 에 적용됨) — allprojects 로 하위까지 건다.")
}

// ── 빌드 부하·속도 설정(chore/gradle-tuning, 2026-09-26) — 모든 Test 태스크 공통 ──
// - 빌드 캐시(gradle.properties org.gradle.caching=true)에서 Test 를 뺀다. 테스트가 선언되지 않은 외부 입력에 기댄다 —
//   작업 트리 밖 파일(mdm: frontend messages.ts·mcm 시드 소스·maru-mdm-engine 코퍼스, mcm-core: mcm 시드 소스·BPMN), 기본 application.yml 의
//   상태 있는 ../data/*.db, BACKEND_CLIENT_KEY 환경 변수. 캐시가 다른 워크트리의 통과 결과를 꺼내 실패를 숨길 수 있다.
//   컴파일 등 다른 태스크는 그대로 캐시한다. 루트 composite 에서 켠 캐시는 모든 includeBuild 에 적용되므로 모듈마다 이 플러그인을 적용한다.
// - 테스트 JVM 은 짧게 돌아 C2 JIT 컴파일이 CPU 만 먹고(측정 시 350% 가까이) 이득이 없다 — C1 까지만 쓴다.

// ── Oracle 시험 PDB(oracle-1007 b4) — 기본은 꺼짐이라 기존 동작은 그대로다 ──
// -Pdmes.ora.test=clone(또는 DMES_ORA_TEST=clone)이면 빌드 한 번에 한 번 템플릿(-Pdmes.ora.template, 기본 TPL_EMPTY)에서
// T_<레인> PDB 를 복제하고 빌드가 끝나면 지운다. -Pdmes.ora.pdb=<PDB>(DMES_ORA_PDB)면 있는 PDB 를 그대로 쓴다.
// 켜면 Test 는 forks=1 이고 접속값이 시스템 속성 dmes.ora.url·dmes.ora.password·dmes.ora.pdb 와 환경 변수 DMES_ORA_URL·
// DMES_ORA_PASSWORD·DMES_ORA_PDB 로 넘어간다(사용자 이름은 시험이 스키마별로 고른다). 인스턴스를 모든 레인이 나눠 쓰므로
// Hikari 상한도 3 으로 건다(SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE).
def oraProp = { String key, String env -> providers.gradleProperty(key).orElse(providers.environmentVariable(env)).getOrNull() }
def oraMode = oraProp('dmes.ora.test', 'DMES_ORA_TEST')
def oraExisting = oraProp('dmes.ora.pdb', 'DMES_ORA_PDB')
def oraService = null
if (oraMode == 'clone' || oraExisting) {
    File repoRoot = rootProject.projectDir
    while (repoRoot != null && !new File(repoRoot, 'scripts/oracle/pdb.mjs').isFile()) repoRoot = repoRoot.parentFile
    if (repoRoot == null) {
        throw new GradleException('scripts/oracle/pdb.mjs 를 찾지 못했다 — 저장소 안에서 실행한다.')
    }
    final File root = repoRoot
    oraService = gradle.sharedServices.registerIfAbsent('dmesOraTestPdb', OraTestPdbService) {
        parameters.repoRoot = root.absolutePath
        parameters.lane = root.name
        parameters.mode = oraExisting ? 'existing' : 'clone'
        parameters.template = oraProp('dmes.ora.template', 'DMES_ORA_TEMPLATE') ?: 'TPL_EMPTY'
        parameters.pdb = oraExisting ?: ''
    }
}

allprojects {
    if (oraService != null) {
        final def svc = oraService
        tasks.withType(Test).configureEach {
            usesService(svc)
            maxParallelForks = 1
            forkEvery = 0
            doFirst {
                String pdb = svc.get().acquire()
                String password = System.getenv('DMES_ORA_PASSWORD') ?: 'dmes_password_123'
                String url = OraTestPdbService.jdbcUrl(pdb)
                logger.lifecycle("[dmes-ora] ${path} 시험 PDB ${pdb} → ${url}")
                systemProperty 'dmes.ora.pdb', pdb
                systemProperty 'dmes.ora.url', url
                systemProperty 'dmes.ora.password', password
                environment 'DMES_ORA_PDB', pdb
                environment 'DMES_ORA_URL', url
                environment 'DMES_ORA_PASSWORD', password
                environment 'SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE', '3'
            }
        }
    }
    tasks.withType(Test).configureEach {
        outputs.doNotCacheIf('선언되지 않은 외부 입력(작업 트리 밖 파일·../data SQLite·환경 변수)에 기대는 테스트') { true }
        // C1 만 쓰면 JVM 이 코드 캐시 기본값을 240MB → 48MB 로 줄인다. mdm/api 1060건에서 "Out of space in CodeCache for
        // adapters" 로 OASIS 호출이 실패했다(2026-09-26) — 원래 기본값으로 되돌린다(예약 크기라 쓰는 만큼만 잡힌다).
        // 주의: 이 관례는 plugins {} 단계에서 모듈 루트 스크립트 본문보다 먼저 등록된다 — 모듈 test 블록에서 jvmArgs 를
        // 대입(jvmArgs = [...])하면 아래 값이 덮이므로, 더할 때는 jvmArgs '...'(추가)로 쓴다.
        jvmArgs '-XX:TieredStopAtLevel=1', '-XX:ReservedCodeCacheSize=240m'
    }
}
