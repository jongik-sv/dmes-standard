// dmes.test-conventions — 백엔드 모듈 공통 Test 관례(빌드 캐시 제외·JIT 설정, ③ build-logic, 2026-10-04 에 모듈 루트 build.gradle 끝에서 옮겼다).
// 모듈 루트 build.gradle 의 plugins { … id 'dmes.test-conventions' } 로 루트 프로젝트에만 한 번 적용한다. 아래 allprojects
// 가 그 빌드의 모든 프로젝트(하위 lib·api, cactus-core 가 끌어오는 oasis-core·oasis-core-api 포함)의 Test 에 건다.
// PC 전역 테스트 슬롯은 여기서 걸지 않는다 — 모듈 루트 build.gradle 끝의 apply from: file('../gradle/test-slot.gradle') 가 건다.
// precompiled script plugin 안의 apply from 은 Gradle 9.3.1 에서 구성 단계에 "No service of type ClassLoaderScope available
// in project services" 로 실패하고, test-slot.gradle 은 analog 와 함께 쓰는 단일 구현이라 그 파일을 그대로 apply 한다.
if (project != rootProject) {
    throw new GradleException("dmes.test-conventions 는 모듈 루트 프로젝트에만 적용한다(${project.path} 에 적용됨) — allprojects 로 하위까지 건다.")
}

// ── 빌드 부하·속도 설정(chore/gradle-tuning, 2026-09-26) — 모든 Test 태스크 공통 ──
// - 빌드 캐시(gradle.properties org.gradle.caching=true)에서 Test 를 뺀다. 테스트가 선언되지 않은 외부 입력에 기댄다 —
//   작업 트리 밖 파일(mdm: frontend messages.ts·mcm 시드 소스·maru-mdm-engine 코퍼스, mcm-core: mcm 시드 소스·BPMN), 기본 application.yml 의
//   상태 있는 ../data/*.db, BACKEND_CLIENT_KEY 환경 변수. 캐시가 다른 워크트리의 통과 결과를 꺼내 실패를 숨길 수 있다.
//   컴파일 등 다른 태스크는 그대로 캐시한다. 루트 composite 에서 켠 캐시는 모든 includeBuild 에 적용되므로 모듈마다 이 플러그인을 적용한다.
// - 테스트 JVM 은 짧게 돌아 C2 JIT 컴파일이 CPU 만 먹고(측정 시 350% 가까이) 이득이 없다 — C1 까지만 쓴다.

// ── Oracle 시험 PDB(oracle-1007 b4) — 기본은 꺼짐이라 기존 동작은 그대로다 ──
// -Pdmes.ora.test=clone(또는 DMES_ORA_TEST=clone)이면 빌드 한 번에 한 번 템플릿(-Pdmes.ora.template, 기본 TPL_EMPTY)에서
// T_<레인> PDB 를 복제하고 빌드가 끝나면 지운다. -Pdmes.ora.pdb=<PDB>(DMES_ORA_PDB)면 있는 PDB 를 그대로 쓴다.
// 켜면 Test 는 forks=1 이고 접속값이 시스템 속성 dmes.ora.url·dmes.ora.password·dmes.ora.pdb 와 환경 변수 DMES_ORA_URL·
// DMES_ORA_PASSWORD·DMES_ORA_PDB 로 넘어간다(사용자 이름은 시험이 스키마별로 고른다). 인스턴스를 모든 레인이 나눠 쓰므로
// 시험 JVM 의 접속 수를 줄이는 기본값을 시스템 속성으로 건다(Spring 컨텍스트마다 Hikari 풀이 열려 VM 안 접속이 25개까지 늘어 스래싱했다):
//   spring.datasource.hikari.maximum-pool-size=2 · minimum-idle=0 · idle-timeout=10000 · spring.test.context.cache.maxSize=2
// 다중 데이터소스 모듈은 접두 키도 같은 값으로 건다(아래 oraPoolExtras). 끄려면 -Pdmes.ora.poolExtras=none.
// 주의: cactus.datasource.extras.<이름> 키는 이름이 yml 에 정의돼 있을 때만 안전하다(없는 이름이면 url 없는 항목이 생겨 기동이 실패한다).
def oraProp = { String key, String env -> providers.gradleProperty(key).orElse(providers.environmentVariable(env)).getOrNull() }
def oraMode = oraProp('dmes.ora.test', 'DMES_ORA_TEST')
def oraExisting = oraProp('dmes.ora.pdb', 'DMES_ORA_PDB')
// 다중 데이터소스의 접두(모듈 루트 프로젝트 이름 기준 기본값). 쉼표로 구분하고 -Pdmes.ora.poolExtras=<접두,접두>(none 이면 끔)로 바꾼다.
//   cactus.datasource.extras.<이름>  → 키 maximum-pool-size·idle-timeout (cactus 방식)
//   spring.datasource.<이름>         → 키 (hikari.)maximum-pool-size·minimum-idle·idle-timeout (Spring 방식, 직접 바인딩 모듈은 hikari. 없이)
def oraPoolExtrasDefault = [
    'mcm'        : 'cactus.datasource.extras.cmn,cactus.datasource.extras.if,cactus.datasource.extras.caravan',
    'caravan-hub': 'spring.datasource.mst,spring.datasource.if',
]
def oraPoolExtras = (oraProp('dmes.ora.poolExtras', 'DMES_ORA_POOL_EXTRAS') ?: oraPoolExtrasDefault.get(rootProject.name) ?: '')
        .split(',').collect { it.trim() }.findAll { it && it != 'none' }
def oraService = null
if (oraMode == 'clone' || oraExisting) {
    File repoRoot = rootProject.projectDir
    while (repoRoot != null && !new File(repoRoot, 'scripts/oracle/pdb.mjs').isFile()) repoRoot = repoRoot.parentFile
    if (repoRoot == null) {
        throw new GradleException('scripts/oracle/pdb.mjs 를 찾지 못했다 — 저장소 안에서 실행한다.')
    }
    final File root = repoRoot
    oraService = gradle.sharedServices.registerIfAbsent('dmesOraTestPdb', OraTestPdbService) {
        parameters.repoRoot = root.absolutePath
        parameters.lane = root.name
        parameters.mode = oraExisting ? 'existing' : 'clone'
        parameters.template = oraProp('dmes.ora.template', 'DMES_ORA_TEMPLATE') ?: 'TPL_EMPTY'
        parameters.pdb = oraExisting ?: ''
    }
}

// Oracle 시험 PDB 를 준비하는 일(PC 잠금 → 복제 → 접속값 주입). 시험 슬롯(test-slot.gradle)보다 **먼저** 해야 한다: 슬롯을 쥔 채로 PC 잠금을
// 기다리면, 잠금을 쥔 빌드가 필요로 하는 슬롯을 그 대기자들이 막아 서로 멈춘다(2026-10-07 21:12 교착). 슬롯 스크립트는 ext.dmesPreSlotHook 을
// 슬롯을 잡기 직전에 부르고, 슬롯을 쓰지 않을 때(DMES_TEST_SLOTS=0·CI)는 아래 doFirst 가 같은 일을 한다. 태스크마다 한 번만 한다.
def oraPrepare = null
final long oraTurnWaitMs = (System.getenv('DMES_ORA_TURN_WAIT_MS') ?: '3600000') as long
def oraTurnKey = { Test t -> "${t.path} @ ${t.project.projectDir}".toString() }
if (oraService != null) {
    final def svc = oraService
    oraPrepare = { Test t ->
        if (t.extensions.extraProperties.has('dmesOraPrepared')) return
        t.extensions.extraProperties.set('dmesOraPrepared', true)
        // 같은 빌드의 모듈은 시험 PDB 를 공유하므로 Oracle test 태스크는 한 번에 하나만 돈다(차례 → PC 잠금 → 시험 슬롯). 놓는 일은 태스크 뒤의
        // 마무리 태스크(실패해도 돈다)와 서비스 close 가 한다.
        svc.get().acquireTurn(oraTurnKey(t), oraTurnWaitMs)
        // 모듈 build.gradle 이 maxParallelForks 를 나중에 대입해도 Oracle 시험은 1 로 고정한다(실행 직전 값이 쓰인다).
        t.maxParallelForks = 1
        t.forkEvery = 0
        String pdb = svc.get().acquire()
        String password = System.getenv('DMES_ORA_PASSWORD') ?: 'dmes_password_123'
        String url = OraTestPdbService.jdbcUrl(pdb)
        t.logger.lifecycle("[dmes-ora] ${t.path} 시험 PDB ${pdb} → ${url}")
        t.systemProperty 'dmes.ora.pdb', pdb
        t.systemProperty 'dmes.ora.url', url
        t.systemProperty 'dmes.ora.password', password
        t.environment 'DMES_ORA_PDB', pdb
        t.environment 'DMES_ORA_URL', url
        t.environment 'DMES_ORA_PASSWORD', password
        t.environment 'SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE', '2'
        t.systemProperty 'spring.datasource.hikari.maximum-pool-size', '2'
        t.systemProperty 'spring.datasource.hikari.minimum-idle', '0'
        t.systemProperty 'spring.datasource.hikari.idle-timeout', '10000'
        t.systemProperty 'spring.test.context.cache.maxSize', '2'
        oraPoolExtras.each { String prefix ->
            if (prefix.startsWith('cactus.')) {
                t.systemProperty "${prefix}.maximum-pool-size", '2'
                t.systemProperty "${prefix}.idle-timeout", '10000'
            } else {
                // DataSource 를 HikariDataSource 에 직접 바인딩하는 모듈(caravan-hub)은 prefix.maximum-pool-size, 그렇지 않으면
                // prefix.hikari.* 이다. 어느 쪽인지 모르므로 둘 다 건다(안 쓰는 쪽은 무시된다).
                ['', 'hikari.'].each { String sub ->
                    t.systemProperty "${prefix}.${sub}maximum-pool-size", '2'
                    t.systemProperty "${prefix}.${sub}minimum-idle", '0'
                    t.systemProperty "${prefix}.${sub}idle-timeout", '10000'
                }
            }
        }
    }
    rootProject.extensions.extraProperties.set('dmesPreSlotHook', oraPrepare)
}

allprojects {
    if (oraService != null) {
        final def svc = oraService
        final def prepare = oraPrepare
        tasks.withType(Test).configureEach {
            usesService(svc)
            maxParallelForks = 1
            forkEvery = 0
            // 시험이 실패하면 VM 상태 한 줄을 남겨 VM 크기(3GB) 때문인지 가리게 한다(scripts/oracle/README.md 「Oracle 오류 판별」).
            afterSuite { desc, result ->
                if (desc.parent == null && result.resultType.toString() == 'FAILURE') svc.get().logVmState('시험 실패')
            }
            doFirst { prepare.call(it) }
            // 차례는 태스크가 성공·실패·시험 JVM 비정상 종료 어느 쪽으로 끝나도 마무리 태스크가 놓는다.
            final String turnKey = "${path} @ ${project.projectDir}".toString()
            final def release = project.tasks.register("${name}OraTurnRelease") {
                usesService(svc)
                doLast { svc.get().releaseTurn(turnKey) }
            }
            finalizedBy(release)
        }
    }
    // 모든 시각은 KST 로 통일한다(docs/oracle-1007/schema-owners.md §3.1). 시험 JVM 과 bootRun 이 PC 시간대와 상관없이 Asia/Seoul 을 쓰게
    // 고정한다. systemProperty 는 모듈이 bootRun 의 jvmArgs 를 대입으로 덮어도 남는다. 이미 정해 둔 값이 있으면 건드리지 않는다.
    tasks.withType(Test).configureEach {
        if (!systemProperties.containsKey('user.timezone')) systemProperty 'user.timezone', 'Asia/Seoul'
    }
    tasks.withType(JavaExec).configureEach {
        if (!systemProperties.containsKey('user.timezone')) systemProperty 'user.timezone', 'Asia/Seoul'
    }
    tasks.withType(Test).configureEach {
        outputs.doNotCacheIf('선언되지 않은 외부 입력(작업 트리 밖 파일·../data SQLite·환경 변수)에 기대는 테스트') { true }
        // C1 만 쓰면 JVM 이 코드 캐시 기본값을 240MB → 48MB 로 줄인다. mdm/api 1060건에서 "Out of space in CodeCache for
        // adapters" 로 OASIS 호출이 실패했다(2026-09-26) — 원래 기본값으로 되돌린다(예약 크기라 쓰는 만큼만 잡힌다).
        // 주의: 이 관례는 plugins {} 단계에서 모듈 루트 스크립트 본문보다 먼저 등록된다 — 모듈 test 블록에서 jvmArgs 를
        // 대입(jvmArgs = [...])하면 아래 값이 덮이므로, 더할 때는 jvmArgs '...'(추가)로 쓴다.
        jvmArgs '-XX:TieredStopAtLevel=1', '-XX:ReservedCodeCacheSize=240m'
    }
}
