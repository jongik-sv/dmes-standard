plugins {
    id 'java-library'
    id 'maven-publish'
}

// D7(TSK-01-01 design.md §6.4) — group 은 원천 설계 06-business-rule.md:456-461 패키지표
// (kr.dongkuk.maru.mdm.engine.*) 기준이다. 저장소 관례(com.dongkuk.dmes.*)와 다르다 — 서버 애플리케이션
// 패키지와 겹치지 않게 하라는 원문 제약(06-business-rule.md:453)을 지키기 위한 의도적 결정.
group = 'kr.dongkuk.maru.mdm'
version = '0.1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.add('-parameters')
}

tasks.named('test') {
    useJUnitPlatform()
}

dependencies {
    // 불변 규칙 1(design.md §5) — main 의존은 EvalEx 하나뿐. 좌표는 mavenCentral 재검증 완료
    // (com.ezylang:EvalEx:3.7.0, 대문자 EvalEx 가 실제 artifactId).
    api 'com.ezylang:EvalEx:3.7.0'

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.3.0'
    // TSK-03-01 — 스키마 정본(main resources)과 Java 계약 타입 대조 전용. main 의존이 아니다(불변 규칙 1 유지).
    testImplementation 'com.fasterxml.jackson.core:jackson-databind:2.18.2'
    // TSK-03-02 D5 — AstExporter 출력의 스키마($defs/AstNode) 적합 검사 전용. main 의존이 아니다(불변 규칙 1 유지).
    testImplementation 'com.networknt:json-schema-validator:1.5.9'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// ── 빌드 부하·속도 설정(chore/gradle-tuning, 2026-09-26) — 모든 Test 태스크 공통 ──
// - 빌드 캐시(gradle.properties org.gradle.caching=true)에서 Test 를 뺀다. 테스트가 선언되지 않은 외부 입력에 기댄다 —
//   작업 트리 밖 파일(mdm: frontend messages.ts·mcm DataInitializer·maru-mdm-engine 코퍼스), 기본 application.yml 의
//   상태 있는 ../data/*.db, BACKEND_CLIENT_KEY 환경 변수. 캐시가 다른 워크트리의 통과 결과를 꺼내 실패를 숨길 수 있다.
//   컴파일 등 다른 태스크는 그대로 캐시한다. 루트 composite 에서 켠 캐시는 모든 includeBuild 에 적용되므로 모듈마다 둔다.
// - 테스트 JVM 은 짧게 돌아 C2 JIT 컴파일이 CPU 만 먹고(측정 시 350% 가까이) 이득이 없다 — C1 까지만 쓴다.
allprojects {
    tasks.withType(Test).configureEach {
        outputs.doNotCacheIf('선언되지 않은 외부 입력(작업 트리 밖 파일·../data SQLite·환경 변수)에 기대는 테스트') { true }
        // C1 만 쓰면 JVM 이 코드 캐시 기본값을 240MB → 48MB 로 줄인다. mdm/api 1060건에서 "Out of space in CodeCache for
        // adapters" 로 OASIS 호출이 실패했다(2026-09-26) — 원래 기본값으로 되돌린다(예약 크기라 쓰는 만큼만 잡힌다).
        jvmArgs '-XX:TieredStopAtLevel=1', '-XX:ReservedCodeCacheSize=240m'
    }
}
