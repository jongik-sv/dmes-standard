plugins {
    id 'java-library'
    id 'maven-publish'
}

// D7(TSK-01-01 design.md §6.4) — group 은 원천 설계 06-business-rule.md:456-461 패키지표
// (kr.dongkuk.maru.mdm.engine.*) 기준이다. 저장소 관례(com.dongkuk.dmes.*)와 다르다 — 서버 애플리케이션
// 패키지와 겹치지 않게 하라는 원문 제약(06-business-rule.md:453)을 지키기 위한 의도적 결정.
group = 'kr.dongkuk.maru.mdm'
version = '0.1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.add('-parameters')
}

tasks.named('test') {
    useJUnitPlatform()
}

dependencies {
    // 불변 규칙 1(design.md §5) — main 의존은 EvalEx 하나뿐. 좌표는 mavenCentral 재검증 완료
    // (com.ezylang:EvalEx:3.7.0, 대문자 EvalEx 가 실제 artifactId).
    api 'com.ezylang:EvalEx:3.7.0'

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.3.0'
    // TSK-03-01 — 스키마 정본(main resources)과 Java 계약 타입 대조 전용. main 의존이 아니다(불변 규칙 1 유지).
    testImplementation 'com.fasterxml.jackson.core:jackson-databind:2.18.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
