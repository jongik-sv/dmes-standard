plugins {
    id 'java-library'
    id 'maven-publish'
    id 'dmes.test-conventions'
}

group = 'com.dongkuk.caravan'
version = libs.versions.caravan.console.get()

    repositories {
        // 공개 의존은 mavenCentral 직접 — 사내망 미접속에도 영향 없음
        mavenCentral()
        // 사내 전용 라이브러리(`com.dongkuk:*`, `com.dongkuk.dmes:*`)는 사내 nexus 에서만
        // maven {
        //     url = 'http://172.31.1.96:8889/nexus/content/groups/public'
        //     allowInsecureProtocol = true
        //     content {
        //         includeGroup 'com.dongkuk'
        //         includeGroup 'com.dongkuk.dmes'
        //     }
        // }
    }

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.add('-parameters')
}

tasks.named('test') {
    useJUnitPlatform()
    // sqlite test DB 단일 파일 락 모델 — 병렬 fork 시 SQLITE_BUSY 회피 (aps-core 와 동일 정책)
    maxParallelForks = 1
    forkEvery = 0
}

dependencies {
    api platform(libs.spring.boot.dependencies)

    // caravan-console 는 caravan / cactus-core 를 compileOnly 로만 의존 (소비자 mcm 이 런타임 제공).
    // Decision-11 (caravan-console-MCM 마이그레이션 플랜): mcm → cactus-core → caravan transitive
    compileOnly libs.spring.boot.starter.data.jpa
    compileOnly libs.spring.boot.starter.webmvc
    compileOnly libs.spring.boot.starter.security
    compileOnly libs.spring.boot.starter.validation

    // ── v4 caravan 의존 0 (2026-05-12) + cactus 의존 0 (0.2.0, 2026-05-15) ──
    // caravan-console 가 caravan/Kafka internal class import 0 — 각 모듈 WAS 의 /kafkaApi/* REST 호출만.
    // cactus 의존 0 — 0.2.0 패턴 B (KmcApiResponse / KmcAuditEntity / KmcSeraiClient 자체 정의).
    compileOnly libs.spring.web                   // RestClient (KmcSeraiClient)

    api libs.jackson.databind.managed
    api libs.jackson.datatype.jsr310

    // Annotation processors
    annotationProcessor platform(libs.spring.boot.dependencies)
    compileOnly libs.lombok.base
    annotationProcessor libs.lombok.base

    testImplementation libs.spring.boot.starter.test
    testImplementation libs.spring.boot.starter.data.jpa
    testImplementation libs.spring.boot.starter.webmvc
    testImplementation libs.spring.boot.starter.security
    testImplementation libs.spring.boot.starter.validation
    testImplementation libs.spring.security.test
    testRuntimeOnly libs.sqlite.jdbc
    testRuntimeOnly libs.hibernate.community.dialects.v705
    testRuntimeOnly libs.junit.platform.launcher
}

publishing {
    repositories {
        maven {
            name = 'Snapshots'
            url = 'http://172.31.1.96:8889/nexus/content/repositories/snapshots/'
            credentials {
                username = 'admin'
                password = 'admin123'
            }
            allowInsecureProtocol = true
        }
    }
    publications {
        mavenJava(MavenPublication) {
            artifactId = project.name
            from components.java
        }
    }
}

// PC 전역 테스트 슬롯 — 같은 PC 에서 동시에 도는 Test 태스크를 DMES_TEST_SLOTS(기본 2)개로 묶는다(../gradle/test-slot.gradle).
apply from: file('../gradle/test-slot.gradle')
