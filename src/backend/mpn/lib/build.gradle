plugins {
    id 'org.springframework.boot' apply false
    id 'io.spring.dependency-management'
}

dependencyManagement {
    imports {
        mavenBom org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES
    }
}

tasks.named('test') {
    useJUnitPlatform()
    // SQLite 는 DB 파일 단위 락이라 병렬 fork 시 테스트가 서로 막힌다.
    maxParallelForks = 1
}

dependencies {
    api libs.cactus.core.v1020
    api libs.mcm.core
    api libs.aps.core

    api libs.spring.boot.starter.actuator
    api libs.spring.boot.starter.data.jpa
    api libs.spring.boot.starter.security
    api libs.spring.boot.starter.web
    api libs.spring.boot.starter.validation

    api libs.sqlite.jdbc
    api libs.hibernate.community.dialects.v705

    // 샘플 스키마를 Flyway 로 관리한다.
    // Spring Boot 4 부터 FlywayAutoConfiguration 이 별도 모듈(spring-boot-flyway)로 빠졌다.
    api libs.flyway.core
    api libs.spring.boot.flyway
}
