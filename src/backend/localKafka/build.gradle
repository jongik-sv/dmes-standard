plugins {
    id 'java'
    alias(libs.plugins.spring.boot) apply false
    alias(libs.plugins.spring.dependency.management) apply false
    id 'dmes.test-conventions'
}

allprojects {
    group = 'com.dongkuk.dmes'
    version = '0.0.1-SNAPSHOT'

    repositories {
        mavenCentral()
        // TODO(2026-05-15): 사내 Nexus 접근 불가로 임시 비활성화
        // maven {
        //     url = 'http://172.31.1.96:8889/nexus/content/groups/public'
        //     allowInsecureProtocol = true
        //     content {
        //         includeGroup 'com.dongkuk'
        //         includeGroup 'com.dongkuk.dmes'
        //     }
        // }
    }
}

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'io.spring.dependency-management'

    java {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.compilerArgs.add('-parameters')
    }

    dependencies {
        compileOnly libs.lombok.base
        annotationProcessor libs.lombok.base
        testImplementation libs.spring.boot.starter.test
        testRuntimeOnly libs.junit.platform.launcher
    }

    test {
        useJUnitPlatform()
    }
}

// PC 전역 테스트 슬롯 — 같은 PC 에서 동시에 도는 Test 태스크를 DMES_TEST_SLOTS(기본 2)개로 묶는다(../gradle/test-slot.gradle).
apply from: file('../gradle/test-slot.gradle')
