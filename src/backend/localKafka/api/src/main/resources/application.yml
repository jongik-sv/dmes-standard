spring:
  application:
    name: localKafka
  main:
    web-application-type: none
    banner-mode: console

# ── Embedded Kafka 설정 (io.github.embeddedkafka) ──
# port           : 외부 클라이언트(caravan/MCM 등)가 접속할 broker 포트
# controllerPort : KRaft controller 포트 (broker 포트 + 1 권장)
# partitions     : 토픽 당 파티션 수 (1:1:1 정책 → 1 고정 권장)
# topics         : 기동 시 자동 생성할 토픽 목록. 필요한 토픽을 여기 추가.
localkafka:
  port: 9092
  controller-port: 9093
  partitions: 1
  # v4 Phase 4-C/D PoC 토픽 + DLT (2026-05-13)
  topics:
    - MMPPMMLSPP01
    - MMPPMMLSPP01.dlt
    - MMQCMMLSPP01
    - MMQCMMLSPP01.dlt
    - MMQCMMPNTT01
    - MMQCMMPNTT01.dlt
    - caravan.control

# ── 로깅 ──
logging:
  level:
    root: INFO
    com.dongkuk.dmes.localkafka: DEBUG
    kafka: WARN
    state.change.logger: WARN
    org.apache.kafka: WARN
