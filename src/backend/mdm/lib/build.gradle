plugins {
    id 'org.springframework.boot' apply false
    id 'io.spring.dependency-management'
}

dependencyManagement {
    imports {
        mavenBom org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES
    }
}

tasks.named('test') {
    useJUnitPlatform()
    // SQLite 는 DB 파일 단위 락이라 병렬 fork 시 테스트가 서로 막힌다(mqc/lib/build.gradle 과 동일 이유).
    maxParallelForks = 1
}

dependencies {
    api 'com.dongkuk.dmes:cactus-core:1.0.20-SNAPSHOT'
    api 'com.dongkuk.dmes:mcm-core'
    // D7 — group kr.dongkuk.maru.mdm (com.dongkuk.dmes 아님, design.md §6.2)
    api 'kr.dongkuk.maru.mdm:maru-mdm-engine'

    api 'org.springframework.boot:spring-boot-starter-actuator'
    api 'org.springframework.boot:spring-boot-starter-data-jpa'
    api 'org.springframework.boot:spring-boot-starter-security'
    api 'org.springframework.boot:spring-boot-starter-web'
    api 'org.springframework.boot:spring-boot-starter-validation'

    // local·테스트(SQLite). 운영 DB 는 미정이라 다른 DB 드라이버는 두지 않는다(운영 DB 확정 때 더한다).
    api 'org.xerial:sqlite-jdbc:3.45.3.0'
    api 'org.hibernate.orm:hibernate-community-dialects:7.0.5.Final'

    // Flyway — Spring Boot 4 부터 FlywayAutoConfiguration 이 별도 모듈로 빠졌다(mqc 주석 그대로).
    api 'org.flywaydb:flyway-core'
    api 'org.springframework.boot:spring-boot-flyway'

    // TSK-01-02 T1 — 계약 패키지 전용 규칙·As-Is 마스터 import 금지(mcm-core·maru-mdm-engine 선례와 같은 버전).
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.3.0'

    // TSK-04-02 — OnnxKureEmbeddingEncoder(실 구현, mdm.embedding.encoder=onnx 수동 게이트 전용) 의존.
    // 라이브러리 jar 만 추가한다 — 모델 파일은 커밋하지 않는다. testAll 은 이 인코더를 절대 활성화하지
    // 않으므로(I13) 이 의존이 있어도 testAll 결과에는 영향이 없다. 버전은 poc/mdm-embedding-bench/build.gradle
    // 과 동일(실측 확인).
    api 'com.microsoft.onnxruntime:onnxruntime:1.30.0'
    api 'ai.djl.huggingface:tokenizers:0.38.0'
}

// TSK-04-05 — SAP 데이터 엘리먼트 후보 추출 배치(design.md D1). Spring 없이 main 으로 돌고 후보 CSV 만 쓴다(DB 쓰기 없음).
// build·test·check 에 연결하지 않는다(불변 규칙 I19). 입력·출력 경로는 절대 경로로 준다.
// 실행: cd src/backend/mdm && ../gradlew :lib:sapDictCandidates --no-daemon \
//         --args="--in /abs/sap-extract --out /abs/sap-candidates [--charset MS949]"
tasks.register('sapDictCandidates', JavaExec) {
    group = 'mdm'
    description = 'SAP DDIC 추출 CSV(DD03L·DD04L·DD04T·DD01L)에서 용어·도메인·컬럼 후보와 미대응 목록 CSV 를 만든다.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.dongkuk.dmes.mdm.batch.sapdict.SapDictCandidateCli'
}

// perf-audit P6 — 선언되지 않은 테스트 입력(루트 build.gradle 주석 참고).
tasks.named('test') {
    // NoopTermEmbeddingEncoderTest — api 모듈의 application.yml(lib 테스트 classpath 밖)
    inputs.files(rootProject.file('api/src/main/resources/application.yml'))
            .withPropertyName('apiApplicationYml').withPathSensitivity(PathSensitivity.RELATIVE)
    // RuleAnalysisCorpusTest — 엔진 테스트 리소스의 분석 코퍼스
    inputs.files(rootProject.file('../maru-mdm-engine/src/test/resources/kr/dongkuk/maru/mdm/engine/analysis/analysis-corpus.json'))
            .withPropertyName('engineAnalysisCorpus').withPathSensitivity(PathSensitivity.RELATIVE)
}
