spring:
  datasource:
    # 연결 규약(docs/oracle-1007/schema-owners.md §3) — PDB 는 레인 개발용 L_ORA_MDM 이 기본이다.
    # 속성 이름(dmes.ora.*)으로 적어 시스템 속성 -Ddmes.ora.url 과 env DMES_ORA_URL(be-run.sh·시험 하니스) 둘 다 받는다.
    # SPRING_DATASOURCE_URL·USERNAME·PASSWORD 로도 덮어쓸 수 있다.
    url: ${dmes.ora.url:jdbc:oracle:thin:@//localhost:1521/L_ORA_MDM}
    username: ${dmes.ora.user:MDMAPUSER}
    password: ${dmes.ora.password:dmes_password_123}
    hikari:
      # 로컬 Oracle 인스턴스를 모든 레인이 함께 쓴다 — 풀은 3 이하(§3).
      maximum-pool-size: 3
  jpa:
    # 방언은 연결 메타데이터로 자동 판정한다(OracleDialect).
    hibernate:
      ddl-auto: none
  flyway:
    # 불변 규칙 3(design.md §5) — locations 는 반드시 자기 모듈·방언 폴더로 좁힌다.
    locations: classpath:db/migration/mdm/oracle
