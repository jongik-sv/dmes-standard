spring:
  datasource:
    url: jdbc:sqlite:../data/mdm.db
    driver-class-name: org.sqlite.JDBC
    hikari:
      data-source-properties:
        # 규칙표 §3 #14 — SQLite 는 연결마다 외래키 강제를 켜야 FK·cascade 가 동작한다(TSK-01-02 D4).
        # URL 파라미터가 아니라 드라이버 속성으로 켜서, 테스트가 URL 만 바꿔 넣어도 유지되게 한다.
        # 키는 대괄호 표기로 적어 Spring 이 Map 키를 바꾸지 않게 한다.
        "[foreign_keys]": true
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        # TSK-08-01 D5 — SQLite 업무 일시(LocalDateTime)를 KST 'yyyy-MM-dd HH:mm:ss' 텍스트로 읽고 쓴다(규칙표 #16).
        # xerial 기본 바인딩은 정수(epoch millis)로 저장해 네이티브 쓰기(MdmTemporalBinder)와 어긋난다. mls 선례처럼
        # Spring Boot 기본 EMF 에 yml 로 등록한다. local-db·wildfly 에는 적지 않는다(MSSQL 은 DATETIME2 네이티브).
        # TSK-06-01 D7 도 같은 등록을 쓴다(04 엔티티 일시 — 두 Task 가 같은 컨버터를 한 벌로 합쳤다).
        metadata_builder_contributor: com.dongkuk.dmes.mdm.common.support.MdmSqliteTemporalContributor
  flyway:
    # 불변 규칙 3(design.md §5) — locations 는 반드시 자기 모듈·방언 폴더로 좁힌다.
    locations: classpath:db/migration/mdm/sqlite
