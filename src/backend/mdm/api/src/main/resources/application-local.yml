spring:
  datasource:
    url: jdbc:sqlite:../data/mdm.db
    driver-class-name: org.sqlite.JDBC
    hikari:
      data-source-properties:
        # 규칙표 §3 #14 — SQLite 는 연결마다 외래키 강제를 켜야 FK·cascade 가 동작한다(TSK-01-02 D4).
        # URL 파라미터가 아니라 드라이버 속성으로 켜서, 테스트가 URL 만 바꿔 넣어도 유지되게 한다.
        # 키는 대괄호 표기로 적어 Spring 이 Map 키를 바꾸지 않게 한다.
        "[foreign_keys]": true
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        # TSK-07-01 design.md F7·F8 — SQLite 커뮤니티 dialect + xerial 드라이버의 네이티브 temporal
        # 라운드트립 결함(mcm SqliteTemporalConverterContributor 선례가 경고)을 우회한다. LocalDateTime
        # 을 이 Task 가 mdm 에서 처음 매핑하므로(05 선분 valid_from/valid_to 등) 여기서 처음 등록한다.
        # MSSQL(application-local-db.yml)은 건드리지 않으므로 SQLite 프로파일에만 스코프된다.
        metadata_builder_contributor: com.dongkuk.dmes.mdm.persistence.MdmSqliteTemporalConverterContributor
  flyway:
    # 불변 규칙 3(design.md §5) — locations 는 반드시 자기 모듈·방언 폴더로 좁힌다.
    locations: classpath:db/migration/mdm/sqlite
