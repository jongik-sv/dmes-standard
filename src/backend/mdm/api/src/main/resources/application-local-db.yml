# D8(design.md "담당자 확인 필요 결정") 전제 — DB_USERNAME 계정의 기본 스키마가 mdm 전용
# (예: MDMAPUSER)이어야 Flyway 이력 테이블이 다른 모듈과 섞이지 않는다. 배포 시 확인할 것.
spring:
  datasource:
    url: jdbc:sqlserver://${DB_HOST}:${DB_PORT:1433};databaseName=${DB_NAME};encrypt=false;trustServerCertificate=true
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    database-platform: org.hibernate.dialect.SQLServerDialect
    hibernate:
      ddl-auto: none
  flyway:
    locations: classpath:db/migration/mdm/mssql
