spring:
  application:
    name: mdm
  profiles:
    # be-run.sh 는 mdm 을 --args='--spring.profiles.active=local' 로 항상 명시 기동하므로(be-run.sh:569)
    # ./be-run.sh --mdm 경로에는 이 default 가 없어도 된다. 다만 IDE·`../gradlew :api:bootRun`(인자 없이)로
    # 직접 띄우는 경로는 default 가 없으면 datasource 미설정으로 기동이 실패한다(design.md §6.3).
    default: local
    group:
      dev: [wildfly]
      prod: [wildfly]
  flyway:
    enabled: true
  autoconfigure:
    # mdm 은 TB_SEC_CODE_*(mcm-core 소유 마스터 코드 표)를 쓰지 않는다. 그 표에 기대는 빈은 모두 @ConditionalOnBean 이라 함께 물러난다.
    exclude: com.dongkuk.dmes.cactus.mastercode.MasterCodeJpaAutoConfiguration
  jpa:
    properties:
      # 공통 Hibernate 설정(docs/oracle-1007/schema-owners.md §3.1.1) — local·wildfly 공통. hibernate.jdbc.time_zone 은 넣지 않는다(JVM Asia/Seoul).
      # boolean 칸을 NUMBER(1) 로 유지(운영 Oracle 이 23 미만일 수 있다). BIT 가 아니라 TINYINT: Hibernate 7.2.12 OracleDialect 는
      # DB 23 이상에서 BIT 를 BOOLEAN 으로 매핑해 NUMBER(1) validate 가 실패하고, TINYINT 는 오류가 없다(ora-mcm-core 실측, 레인 공통).
      hibernate.type.preferred_boolean_jdbc_type: TINYINT
      hibernate.type.preferred_instant_jdbc_type: TIMESTAMP # Instant 감사 칸(C_AT·U_AT)을 TIMESTAMP(6) 에 KST 로 저장
      # SQL 로그를 mcm 처럼 여러 줄로 찍는다. 서식만 바꾸며 로그 수준은 application-local.yml 이 정한다(운영은 SQL 로그 꺼짐).
      hibernate.format_sql: true

cactus:
  # TSK-01-03 D6: BFF 신뢰 채널을 켜서 요청 역할(X-Authenticated-Role)을 서비스가 받게 한다. mls application.yml:41-66 선례.
  # jwt.secret 이 있어야 CactusWebSecurityAutoConfiguration 이 켜지고 ClientKeyFilter 가 등록된다. mdm 은
  # 로그인을 호스팅하지 않으므로 cactus.auth.enabled 는 켜지 않는다(토큰 발급 주체는 mcm).
  jwt:
    secret: ${CACTUS_JWT_SECRET:Y2FjdHVzLXNhbXBsZS1zZWNyZXQta2V5LWZvci10ZXN0aW5nLW9ubHktMjAyNg==}
    issuer: mdm
  security:
    # mls(application.yml:59)·analog(application.yml:26) 선례와 동일 값. BFF(m-mcm/proxy.ts)가
    # OASIS 호출 시 이 헤더를 검증한다 — 이번 샘플 화면은 API 를 호출하지 않지만 다음 화면 Task 가
    # 바로 쓸 수 있도록 지금 넣어 둔다(design.md §6.3).
    client-key: ${BACKEND_CLIENT_KEY:dmes-bff-local-client-key-2026}
    # override 시 default 3종이 통째로 대체되므로 전부 나열한다(ClientKeyFilter). @Value 바인딩이라 콤마 문자열.
    client-key-skip-paths: /auth/,/api/auth/,/actuator/
  oasis:
    service-group: mdm
    service-path: /services
    transactional: true

server:
  port: 8096

# TSK-04-02 — 용어 임베딩 인코더(TermEmbeddingEncoder). 운영 기본은 반드시 none(no-op, I13) —
# 모델 파일 없이 가짜 벡터가 EMBEDDING 에 박히는 사고를 막는다(D5, TRD.md:137). fake 는 테스트 클래스의
# @TestPropertySource 로만 켜고 이 파일에는 두지 않는다. onnx 는 onnxEmbeddingManualTest 전용이다.
mdm:
  embedding:
    encoder: none
    model-dir: ""

# ── 로깅 ──
# OASIS 메서드 해석(Try binding·Strategy) 요청마다 남는 INFO 를 끈다 — analog 가 쓰는 문구(Task·Process·Service·Invoking class)는 이 패키지에서 나오지 않는다(버리는 규칙 'has bound by name' 만 해당).
logging:
  level:
    com.dongkuk.oasis.methodinvoker: WARN
