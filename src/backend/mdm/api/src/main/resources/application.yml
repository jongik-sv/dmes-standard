spring:
  application:
    name: mdm
  profiles:
    # be-run.sh 는 mdm 을 --args='--spring.profiles.active=local' 로 항상 명시 기동하므로(be-run.sh:569)
    # ./be-run.sh --mdm 경로에는 이 default 가 없어도 된다. 다만 IDE·`../gradlew :api:bootRun`(인자 없이)로
    # 직접 띄우는 경로는 default 가 없으면 datasource 미설정으로 기동이 실패한다(design.md §6.3).
    default: local
    group:
      dev: [wildfly]
      prod: [wildfly]
  flyway:
    enabled: true

cactus:
  # TSK-01-03 D6: BFF 신뢰 채널을 켜서 요청 역할(X-Authenticated-Role)을 서비스가 받게 한다. mls application.yml:41-66 선례.
  # jwt.secret 이 있어야 CactusWebSecurityAutoConfiguration 이 켜지고 ClientKeyFilter 가 등록된다. mdm 은
  # 로그인을 호스팅하지 않으므로 cactus.auth.enabled 는 켜지 않는다(토큰 발급 주체는 mcm).
  jwt:
    secret: ${CACTUS_JWT_SECRET:Y2FjdHVzLXNhbXBsZS1zZWNyZXQta2V5LWZvci10ZXN0aW5nLW9ubHktMjAyNg==}
    issuer: mdm
  security:
    # mls(application.yml:59)·analog(application.yml:26) 선례와 동일 값. BFF(m-mcm/proxy.ts)가
    # OASIS 호출 시 이 헤더를 검증한다 — 이번 샘플 화면은 API 를 호출하지 않지만 다음 화면 Task 가
    # 바로 쓸 수 있도록 지금 넣어 둔다(design.md §6.3).
    client-key: ${BACKEND_CLIENT_KEY:dmes-bff-local-client-key-2026}
    # override 시 default 3종이 통째로 대체되므로 전부 나열한다(ClientKeyFilter). @Value 바인딩이라 콤마 문자열.
    client-key-skip-paths: /auth/,/api/auth/,/actuator/
  oasis:
    service-group: mdm
    service-path: /services
    transactional: true

server:
  port: 8096
