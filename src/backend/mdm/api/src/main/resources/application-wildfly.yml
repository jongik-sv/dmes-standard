# D6(design.md "담당자 확인 필요 결정") — wildfly 는 사전 관리 스키마 전제, 데이터소스는 WAS 의 JNDI 로 받는다.
# 운영 DB 는 미정이다(ADR-0004). JNDI 이름은 JNDI_DS_BIZ 로 넘기고, Hibernate 방언은 연결 메타데이터로 자동 판정한다.
spring:
  datasource:
    jndi-name: "${JNDI_DS_BIZ:java:/jdbc/mdm/dsBiz}"
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: false   # D6: wildfly 는 사전 관리 스키마 전제 — 마이그레이션은 local(SQLite)로만 검증한다
