plugins {
    id 'org.springframework.boot'
    id 'war'
}

bootRun {
    // 모듈 루트를 작업 디렉터리로 고정한다. application.yml 의 상대 경로(../data)가 여기에 걸린다.
    workingDir = rootProject.projectDir
}

dependencies {
    api project(':lib')
    runtimeOnly files(project(':lib').sourceSets.main.output)

    // 외장 WAS 배포를 전제로 내장 톰캣은 provided 처리한다.
    providedRuntime libs.tomcat.embed.core
    providedRuntime libs.tomcat.embed.el
    providedRuntime libs.tomcat.embed.websocket

    // TSK-07-01 design.md F17 — MdmTemporalSegmentStoreNoImplementationTest(§3.5)가 lib+api 양쪽
    // main 클래스를 함께 스캔해야 해서 api/src/test 에 둔다. lib/build.gradle 은 이미 선언돼 있다.
    testImplementation libs.archunit.junit5
    // 룰 세트 흐름도 2단계 Task 4 — 기록 실행 응답(RunTrace)을 엔진 계약 스키마로 검증한다(엔진 테스트와 같은 버전).
    testImplementation libs.json.schema.validator
}

bootWar {
    archiveFileName = 'mdm.war'
}

// TSK-04-02 — OnnxKureEmbeddingEncoder 실측 수동 게이트. 별도 sourceSet(testAll 미포함 — check/test 어느 것도
// 이 태스크에 의존하지 않는다). 모델 파일이 없으면 SKIPPED(빨강 아님).
sourceSets {
    onnxTest {
        compileClasspath += sourceSets.main.output + sourceSets.test.output
        runtimeClasspath += sourceSets.main.output + sourceSets.test.output
    }
}
configurations {
    onnxTestImplementation.extendsFrom testImplementation
    onnxTestRuntimeOnly.extendsFrom testRuntimeOnly
}
tasks.register('onnxEmbeddingManualTest', Test) {
    description = 'OnnxKureEmbeddingEncoder 를 실제 ONNX 모델 파일로 인코딩·재측정한다. 모델 파일 없으면 SKIPPED, testAll 비포함.'
    group = 'verification'
    testClassesDirs = sourceSets.onnxTest.output.classesDirs
    classpath = sourceSets.onnxTest.runtimeClasspath
    useJUnitPlatform()
    systemProperty 'mdm.embedding.model-dir', System.getenv('MDM_EMBEDDING_MODEL_DIR') ?: ''
    systemProperty 'mdm.embedding.encoder', 'onnx'
    testLogging { events 'passed', 'failed', 'skipped'; showStandardStreams = true; exceptionFormat = 'full' }
}

// perf-audit P6 — 선언되지 않은 테스트 입력(루트 build.gradle 주석 참고).
tasks.named('test') {
    // RuleSetSimulateTest — -Dgolden.update=true 면 골든 파일(rule-set-trace-golden.json)을 다시 쓴다. 값이 없으면 비교만 한다.
    systemProperty 'golden.update', System.getProperty('golden.update', 'false')
    // DmdScreenMessageParityTest — 화면 메시지 사본
    inputs.files(rootProject.file('../../frontend/m-mdm/pages/dmd/dataItemMng/messages.ts'),
                rootProject.file('../../frontend/m-mdm/pages/dmd/dataItemMng/cate/messages.ts'),
                rootProject.file('../../frontend/m-mdm/pages/dmd/dataMng/messages.ts'))
            .withPropertyName('mdmScreenMessages').withPathSensitivity(PathSensitivity.RELATIVE)
    // MdmOasisActionVocabularyTest — mcm 메뉴·버튼 시드(DataInitializer, a6 2단계부터 seed/MdmMenuSeeder·CoreRbacSeeder)
    inputs.files(rootProject.file('../mcm/api/src/main/java/com/dongkuk/dmes/mcm/init/DataInitializer.java'),
                rootProject.file('../mcm/api/src/main/java/com/dongkuk/dmes/mcm/init/seed/MdmMenuSeeder.java'),
                rootProject.file('../mcm/api/src/main/java/com/dongkuk/dmes/mcm/init/seed/CoreRbacSeeder.java'))
            .withPropertyName('mcmDataInitializer').withPathSensitivity(PathSensitivity.RELATIVE)
    // RuleLedgerChecksTest — 룰 세트 코퍼스·퍼즈 사례(lib 테스트 리소스)를 파일 경로로 직접 읽는다
    inputs.files(rootProject.file('lib/src/test/resources/com/dongkuk/dmes/mdm/common/rule/rule-set-corpus.json'),
                rootProject.file('lib/src/test/resources/com/dongkuk/dmes/mdm/common/rule/rule-set-fuzz.json'))
            .withPropertyName('ruleSetCorpusAndFuzz').withPathSensitivity(PathSensitivity.RELATIVE)
    // MdmLocalSample*Test — 로컬 샘플 SQL(리소스가 아니라 파일 경로로 읽는다)
    inputs.files(rootProject.file('sample/mdm-local-sample.sql'))
            .withPropertyName('mdmLocalSample').withPathSensitivity(PathSensitivity.RELATIVE)
    // *OasisHttpTest·MdmSecurityChainTest 등 — 클라이언트 키, application.yml 의 JWT 비밀 기본값을 덮는 환경 변수
    inputs.property('env.BACKEND_CLIENT_KEY.sha256', rootProject.mdmEnvFingerprint.call('BACKEND_CLIENT_KEY'))
    inputs.property('env.CACTUS_JWT_SECRET.sha256', rootProject.mdmEnvFingerprint.call('CACTUS_JWT_SECRET'))
}
