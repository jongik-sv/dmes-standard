plugins {
    id 'java'
    alias(libs.plugins.spring.boot) apply false
    alias(libs.plugins.spring.dependency.management) apply false
    id 'dmes.test-conventions'
}

allprojects {
    group = 'com.dongkuk.dmes'
    version = '0.0.1-SNAPSHOT'

    repositories {
        mavenLocal()
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'io.spring.dependency-management'

    java {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.compilerArgs.add('-parameters')
    }

    dependencies {
        compileOnly libs.lombok.base
        annotationProcessor libs.lombok.base
        testImplementation libs.spring.boot.starter.test
        testRuntimeOnly libs.junit.platform.launcher
    }

    test {
        useJUnitPlatform()
        // 화면 Task 가 늘며 @SpringBootTest 컨텍스트 캐시가 커져 기본 힙(512m)에서 OOM 이 났다(2026-09-24 TSK-07-03 머지 뒤 api 14건).
        // 캐시 상한 4·Hikari 풀 2·공유 테스트 DB(AbstractMdmSharedDbTest) 뒤 api 힙 사용 최대 약 0.64GB(1536m 때 1.29GB),
        // 768m 에서도 865건 통과(2026-09-26 perf-audit P10). 테스트가 늘 여유를 두고 1g 로 낮춘다.
        maxHeapSize = '1g'
        // 테스트 컨텍스트마다 Hikari 풀을 쥔다. 시험 DB 는 Oracle 시험 PDB 이고 인스턴스를 모든 레인이 나눠 쓰므로(oracle-1007 m3)
        // 상한 2·쉬는 연결 0·쉬는 연결 idle-timeout 10초(Hikari 하한)로 둔다 — 정리 주기(기본 30초) 때문에 실제로는 최대 약 40초 뒤 닫힌다.
        // 상한 2 는 DataSegmentLockSqliteTest(이름만 옛 SQLite 시절 그대로, Oracle 에서 돈다)의 두 연결 동시 수정 때문이다.
        // 시스템 속성이라 application-local.yml(상한 3)과 하니스 env SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE(3)보다 우선한다.
        // AbstractMdmSharedDbTest 를 상속하는 시험은 같은 값을 @DynamicPropertySource 로도 넣는다(IDE 실행 대비).
        systemProperty 'spring.datasource.hikari.maximum-pool-size', '2'
        systemProperty 'spring.datasource.hikari.minimum-idle', '0'
        systemProperty 'spring.datasource.hikari.idle-timeout', '10000'
        // MdmSharedTestDb 안전장치 — T_ 로 시작하지 않는 PDB(-Pdmes.ora.pdb=<PDB>)를 시험이 지워도 된다는 레인의 명시.
        // 값은 true 가 아니라 그 PDB 이름이다(-Pdmes.ora.allowReset=<PDB>): 실제 접속의 CON_NAME 과 대소문자 무시로 같을 때만 허용된다.
        // Gradle 의 -D 는 시험 JVM 에 넘어가지 않으므로 -P(또는 -D)로 받은 값을 여기서 그대로 넘긴다.
        // L_·TPL_ 로 시작하는 PDB 와 FREEPDB1·CDB$ROOT·PDB$SEED 는 이 값과 상관없이 늘 거부한다
        // (~/.gradle/gradle.properties 에 남은 값이 다른 레인의 개발 PDB·템플릿을 지우지 못하게).
        def oraAllowReset = providers.gradleProperty('dmes.ora.allowReset').getOrElse(System.getProperty('dmes.ora.allowReset', ''))
        if (oraAllowReset) {
            systemProperty 'dmes.ora.allowReset', oraAllowReset
        }
        // 시험 JVM 의 Locale — 앱은 be-run.sh 에서 -Duser.language=ko -Duser.country=KR 로 뜨는데 시험 JVM 은 Gradle 데몬 기본값을 따라,
        // Oracle JDBC 가 Locale 로 정하는 세션 NLS(NLS_SORT 등) 실측이 PC 마다 달라졌다. 앱과 같게 고정한다. 이미 정해 둔 값은 덮지 않는다.
        if (!systemProperties.containsKey('user.language')) systemProperty 'user.language', 'ko'
        if (!systemProperties.containsKey('user.country')) systemProperty 'user.country', 'KR'
        // 하니스(-Pdmes.ora.test=clone·-Pdmes.ora.pdb)가 꺼져 있으면 시험이 application-local.yml 의 기본 URL(레인 개발 PDB L_ORA_MDM)로
        // 붙을 수 있다. 접속값이 하나도 없으면 존재하지 않는 시험 PDB 로 막는다(MdmSharedTestDb 는 T_ 가 아니라 이 값을 거부한다).
        // 하니스가 켜지면 그 doFirst 가 실행 직전에 systemProperty 'dmes.ora.url' 을 실제 값으로 덮는다(dmes.test-conventions).
        if (!systemProperties.containsKey('dmes.ora.url') && !System.getenv('DMES_ORA_URL')) {
            systemProperty 'dmes.ora.url', 'jdbc:oracle:thin:@//localhost:1521/NO_TEST_PDB'
        }
    }
}

// ── perf-audit P6 — 테스트가 직접 읽는 작업 트리 밖 파일·환경 변수를 Test 입력으로 선언한다 ──
// 선언이 없으면 이 값이 바뀌어도 test 가 UP-TO-DATE 로 건너뛰어, 팀원이 --rerun-tasks 로 전 모듈을 다시 컴파일했다.
// 파일은 내용만 보도록 RELATIVE, 환경 변수는 값 대신 SHA-256 을 넣는다(비밀값을 실행 이력에 남기지 않는다).
// 테스트에 새 외부 입력(Path.of("../…"), System.getenv)을 더하면 여기에도 더한다. 빌드 캐시 제외(build-logic 의 dmes.test-conventions)는 그대로 둔다.
ext.mdmEnvFingerprint = { String name ->
    String value = System.getenv(name)
    value == null ? '<unset>' : java.security.MessageDigest.getInstance('SHA-256').digest(value.getBytes('UTF-8')).encodeHex().toString()
}

// ── mqc 와 다른 지점(D9, design.md §6.1b) — 루트 :test 가 서브프로젝트 테스트를 실제로 실행하도록 명시 집계 ──
// testAll(src/backend/build.gradle) 이 gradle.includedBuild('mdm').task(':test') 하나에만 의존하므로,
// 이 의존을 걸어 두지 않으면 :lib:test/:api:test 가 testAll 그래프에 들어오지 않는다(실측 확인 완료 —
// mqc/mpp/mls/mpn/mcm/analog 는 이 결함을 그대로 물려받고 있다, D9 "반려되면 재작업 방향" 참고).
tasks.named('test') {
    dependsOn(subprojects.collect { "${it.path}:test" })
}

// PC 전역 테스트 슬롯 — 같은 PC 에서 동시에 도는 Test 태스크를 DMES_TEST_SLOTS(기본 2)개로 묶는다(../gradle/test-slot.gradle).
apply from: file('../gradle/test-slot.gradle')
