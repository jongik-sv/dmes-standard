plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.6' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
}

allprojects {
    group = 'com.dongkuk.dmes'
    version = '0.0.1-SNAPSHOT'

    repositories {
        mavenLocal()
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'io.spring.dependency-management'

    java {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.compilerArgs.add('-parameters')
    }

    dependencies {
        compileOnly 'org.projectlombok:lombok'
        annotationProcessor 'org.projectlombok:lombok'
        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    test {
        useJUnitPlatform()
        // 화면 Task 가 늘며 @SpringBootTest 컨텍스트 캐시가 커져 기본 힙(512m)에서 OOM 이 났다(2026-09-24 TSK-07-03 머지 뒤 api 14건).
        // 캐시 상한 4·Hikari 풀 2·공유 테스트 DB(AbstractMdmSharedDbTest) 뒤 api 힙 사용 최대 약 0.64GB(1536m 때 1.29GB),
        // 768m 에서도 865건 통과(2026-09-26 perf-audit P10). 테스트가 늘 여유를 두고 1g 로 낮춘다.
        maxHeapSize = '1g'
        // 테스트 컨텍스트마다 Hikari 풀(기본 10연결)을 쥔다. SQLite 는 쓰기가 직렬이라 2개면 충분하다(perf-audit P2).
        // 시스템 속성이라 application*.yml 보다 우선한다. DataSegmentLockSqliteTest 의 두 스레드 동시 수정도 2개로 돈다.
        systemProperty 'spring.datasource.hikari.maximum-pool-size', '2'
    }
}

// ── perf-audit P6 — 테스트가 직접 읽는 작업 트리 밖 파일·환경 변수를 Test 입력으로 선언한다 ──
// 선언이 없으면 이 값이 바뀌어도 test 가 UP-TO-DATE 로 건너뛰어, 팀원이 --rerun-tasks 로 전 모듈을 다시 컴파일했다.
// 파일은 내용만 보도록 RELATIVE, 환경 변수는 값 대신 SHA-256 을 넣는다(비밀값을 실행 이력에 남기지 않는다).
// 테스트에 새 외부 입력(Path.of("../…"), System.getenv)을 더하면 여기에도 더한다. 빌드 캐시 제외(루트 파일 끝)는 그대로 둔다.
ext.mdmEnvFingerprint = { String name ->
    String value = System.getenv(name)
    value == null ? '<unset>' : java.security.MessageDigest.getInstance('SHA-256').digest(value.getBytes('UTF-8')).encodeHex().toString()
}

// ── mqc 와 다른 지점(D9, design.md §6.1b) — 루트 :test 가 서브프로젝트 테스트를 실제로 실행하도록 명시 집계 ──
// testAll(src/backend/build.gradle) 이 gradle.includedBuild('mdm').task(':test') 하나에만 의존하므로,
// 이 의존을 걸어 두지 않으면 :lib:test/:api:test 가 testAll 그래프에 들어오지 않는다(실측 확인 완료 —
// mqc/mpp/mls/mpn/mcm/analog 는 이 결함을 그대로 물려받고 있다, D9 "반려되면 재작업 방향" 참고).
tasks.named('test') {
    dependsOn(subprojects.collect { "${it.path}:test" })
}

// ── 빌드 부하·속도 설정(chore/gradle-tuning, 2026-09-26) — 모든 Test 태스크 공통 ──
// - 빌드 캐시(gradle.properties org.gradle.caching=true)에서 Test 를 뺀다. 테스트가 선언되지 않은 외부 입력에 기댄다 —
//   작업 트리 밖 파일(mdm: frontend messages.ts·mcm DataInitializer·maru-mdm-engine 코퍼스), 기본 application.yml 의
//   상태 있는 ../data/*.db, BACKEND_CLIENT_KEY 환경 변수. 캐시가 다른 워크트리의 통과 결과를 꺼내 실패를 숨길 수 있다.
//   컴파일 등 다른 태스크는 그대로 캐시한다. 루트 composite 에서 켠 캐시는 모든 includeBuild 에 적용되므로 모듈마다 둔다.
// - 테스트 JVM 은 짧게 돌아 C2 JIT 컴파일이 CPU 만 먹고(측정 시 350% 가까이) 이득이 없다 — C1 까지만 쓴다.
allprojects {
    tasks.withType(Test).configureEach {
        outputs.doNotCacheIf('선언되지 않은 외부 입력(작업 트리 밖 파일·../data SQLite·환경 변수)에 기대는 테스트') { true }
        // C1 만 쓰면 JVM 이 코드 캐시 기본값을 240MB → 48MB 로 줄인다. mdm/api 1060건에서 "Out of space in CodeCache for
        // adapters" 로 OASIS 호출이 실패했다(2026-09-26) — 원래 기본값으로 되돌린다(예약 크기라 쓰는 만큼만 잡힌다).
        jvmArgs '-XX:TieredStopAtLevel=1', '-XX:ReservedCodeCacheSize=240m'
    }
}
