plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.6' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
}

allprojects {
    group = 'com.dongkuk.dmes'
    version = '0.0.1-SNAPSHOT'

    repositories {
        mavenLocal()
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'io.spring.dependency-management'

    java {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.compilerArgs.add('-parameters')
    }

    dependencies {
        compileOnly 'org.projectlombok:lombok'
        annotationProcessor 'org.projectlombok:lombok'
        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    test {
        useJUnitPlatform()
        // 화면 Task 가 늘며 @SpringBootTest 컨텍스트 캐시가 커져 기본 힙(512m)에서 OOM 이 난다(2026-09-24 TSK-07-03 머지 뒤 api 14건).
        maxHeapSize = '1536m'
        // 테스트 컨텍스트마다 Hikari 풀(기본 10연결)을 쥔다. SQLite 는 쓰기가 직렬이라 2개면 충분하다(perf-audit P2).
        // 시스템 속성이라 application*.yml 보다 우선한다. DataSegmentLockSqliteTest 의 두 스레드 동시 수정도 2개로 돈다.
        systemProperty 'spring.datasource.hikari.maximum-pool-size', '2'
    }
}

// ── mqc 와 다른 지점(D9, design.md §6.1b) — 루트 :test 가 서브프로젝트 테스트를 실제로 실행하도록 명시 집계 ──
// testAll(src/backend/build.gradle) 이 gradle.includedBuild('mdm').task(':test') 하나에만 의존하므로,
// 이 의존을 걸어 두지 않으면 :lib:test/:api:test 가 testAll 그래프에 들어오지 않는다(실측 확인 완료 —
// mqc/mpp/mls/mpn/mcm/analog 는 이 결함을 그대로 물려받고 있다, D9 "반려되면 재작업 방향" 참고).
tasks.named('test') {
    dependsOn(subprojects.collect { "${it.path}:test" })
}

// ── 빌드 부하·속도 설정(chore/gradle-tuning, 2026-09-26) — 모든 Test 태스크 공통 ──
// - 빌드 캐시(gradle.properties org.gradle.caching=true)에서 Test 를 뺀다. 테스트가 선언되지 않은 외부 입력에 기댄다 —
//   작업 트리 밖 파일(mdm: frontend messages.ts·mcm DataInitializer·maru-mdm-engine 코퍼스), 기본 application.yml 의
//   상태 있는 ../data/*.db, BACKEND_CLIENT_KEY 환경 변수. 캐시가 다른 워크트리의 통과 결과를 꺼내 실패를 숨길 수 있다.
//   컴파일 등 다른 태스크는 그대로 캐시한다. 루트 composite 에서 켠 캐시는 모든 includeBuild 에 적용되므로 모듈마다 둔다.
// - 테스트 JVM 은 짧게 돌아 C2 JIT 컴파일이 CPU 만 먹고(측정 시 350% 가까이) 이득이 없다 — C1 까지만 쓴다.
allprojects {
    tasks.withType(Test).configureEach {
        outputs.doNotCacheIf('선언되지 않은 외부 입력(작업 트리 밖 파일·../data SQLite·환경 변수)에 기대는 테스트') { true }
        jvmArgs '-XX:TieredStopAtLevel=1'
    }
}
