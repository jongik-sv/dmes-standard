server:
  port: ${ANALOG_PORT:8191}
  compression:
    enabled: true

# ---------------------------------------------------------------------------
# 읽기전용 DB 뷰어 (ADR-0002) — url 미설정 시 뷰어 비활성, analog 기동은 정상.
# (오류 사유 본문은 DbViewerExceptionHandler 가 직접 만든다.)
# ---------------------------------------------------------------------------
analog:
  db:
    allowed-schemas: "${ANALOG_DB_ALLOWED_SCHEMAS:MCMAPUSER,MCM_SOURCE,MCM_BACKUP,MCAAPUSER,MDMAPUSER}"
    denied-tables: "${ANALOG_DB_DENIED_TABLES:}"
    max-rows: 200
    max-rows-all: 30000
    more-chunk: 5000
    query-timeout-seconds: 10
    url: "${ANALOG_DB_URL:}"
    username: "${ANALOG_DB_USERNAME:}"
    password: "${ANALOG_DB_PASSWORD:}"

spring:
  application:
    name: analog
  main:
    banner-mode: off

logging:
  level:
    root: INFO
    com.dongkuk.dmes.analog: INFO
    com.dongkuk.analogexpress: INFO

# ---------------------------------------------------------------------------
# BFF 신뢰 채널 — X-Client-Key 검증 (cactus ClientKeyFilter 로컬 미러)
# ---------------------------------------------------------------------------
# BFF(be-proxy) 가 부착하는 X-Client-Key 헤더를 검증한다. 키 우선순위는
# env BACKEND_CLIENT_KEY > 본 값 (mpn/mcm 과 동일 관례). 로컬 기본 키는 BFF 로컬 키와 일치.
# skip: /auth/, /api/auth/, /actuator/ — 나머지(/api/meta, /log/**) 전부 키 필수.
cactus:
  security:
    client-key: ${BACKEND_CLIENT_KEY:dmes-bff-local-client-key-2026}

# ---------------------------------------------------------------------------
# 로그 검색 엔진 (analog-express-core) 설정
# ---------------------------------------------------------------------------
# 파일명 컨벤션 — {CLIENT} logback (dmes-{module}.log + dmes-{module}.yyyy-MM-dd.i.log.gz)
#   live    : {log_base_dir 치환}/dmes-mpn.log                  (평문 — 엔진이 직접 읽음)
#   archived: {log_base_dir 치환}/dmes-mpn.2026-05-15.0.log.gz (gzip — 직접 읽지 않음)
# 엔진은 평문 파일만 읽는다. .gz 아카이브는 꼬리 .gz 를 뗀 이름
# (log_file_name_format = dmes-{MODULE}.{FILE_NAME_DATE}.{SEQ}.log) 으로 범위 필터를
# 평가하고, 통과분만 unzip_cache_dir 에 해제한 뒤 그 평문을 검색한다.
# 캐시 재사용: 캐시 파일 mtime ≥ gz mtime 이면 재해제 생략. file_search_limit 는 해제 후 평문 크기 기준.
# {MODULE} 은 module 파라미터에서 자동 추출 (소문자화 + DEV_/QAS_ prefix 제거) — 요청 module 은
# modules 목록 화이트리스트로 검증 후에만 경로에 치환된다 (LogSearchController.validateModule).
analog-express:
  # 로컬 기본값 — 전 모듈 logback 이 공용 src/backend/logs/{module}/ 에 dmes-{module}.log 를
  # 남긴다(각 모듈 bootRun cwd = src/backend/{module} 기준 ../logs/{module}). analog bootRun 의
  # cwd 는 src/backend/analog(api/build.gradle workingDir=rootProject.projectDir) 이므로
  # ../logs/{MODULE} 상대경로로 같은 공용 디렉터리를 읽는다.
  # 운영/개발계는 ANALOG_LOG_BASE_DIR 환경변수로 override 한다 (예: /dmes/logs/{MODULE}).
  log_base_dir: "${ANALOG_LOG_BASE_DIR:../logs/{MODULE}}"
  # gz 아카이브 해제 캐시 디렉터리. 미설정(빈 값) 시 {log_base_dir}/.analog-unzip-cache
  unzip_cache_dir: "${ANALOG_UNZIP_CACHE_DIR:}"
  file_search_limit_megabyte: 1024
  datetime_format: "yyyy-MM-dd HH:mm:ss.SSS"
  begin_index_of_date_time: 0
  end_index_of_date_time: 23
  log_file_name_date_format: "yyyy-MM-dd"
  thread_log_file_name_date_format: "yyyyMMdd_HHmmss"
  byThreadLogFileNameFormat: "{MODULE}_{CLIENT_TYPE}_{THREAD_FILE_NAME_DATE}-{KEYWORD}-THREAD-{SEQ}.log"
  log_file_name_format: "dmes-{MODULE}.{FILE_NAME_DATE}.{SEQ}.log"
  live_log_file_name_format: "dmes-{MODULE}.log"
  stage: "${ANALOG_STAGE:DEV}"
  # sch: 모든 모듈의 예약 작업 로그(MDC serviceId 가 sch. 로 시작) 한 파일 logs/sch/dmes-sch.날짜.0.log (cactus-core dmes-logback-base.xml)
  modules: "${ANALOG_MODULES:mpn,mpp,mqc,mcm,mls,mdm,sch}"
  client_types: "${ANALOG_CLIENT_TYPES:app}"
  # 공유 검색 풀(AnalogSearchExecutors) — 요청마다 풀을 만들지 않고 모든 요청이 나눠 쓴다.
  #   file_search_pool_size : 파일 단위 검색 동시 실행 상한(미설정 시 threads_per_request 값)
  #   range_search_pool_size: 큰 파일을 구간으로 나눠 검색하는 작업 상한(파일 풀과 따로 둔다 — 같은 풀이면 교착)
  #   tree_parse_pool_size  : /log/range/time/tree 동시 파싱 상한(넘으면 503)
  # 동시 요청이 몰리면 파일·범위 풀 대기열에서 기다린다, /tree 는 tree_parse_pool_size 초과 시 503.
  threads_per_request: 8
  range_search_pool_size: 16
  tree_parse_pool_size: 8
  output_limit_megabyte: 100
  minimum_minutes_for_binary_search: 15
  minimum_mega_bytes_for_multi_thread: 80
  encoding: "UTF-8"
  new_line_inspector: "20"

# ---------------------------------------------------------------------------
# 로그 파싱 엔진 (analog-serializer-oasis4) 설정
# ---------------------------------------------------------------------------
# lex_pattern: {CLIENT} 표준 logback 패턴 "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg"
#              에 맞춘 1차 기본값. OASIS 실 로그(serviceTag/service) 가 확보되면 정교화한다.
analog-serializer:
  log_debug: false
  # OASIS 형 로그 라인 (?<time> ?<thread> [?<serviceTag>] [?<service>][?<logger>] ?<level> ?<message>) 에 맞춘 패턴.
  # ServiceListExtraction 이 serviceTag/service named group 을 강제 요구하므로 OASIS 패턴을 유지한다.
  # {CLIENT} 표준 logback 라인은 매치되지 않아 service list 가 빈 list 로 반환된다 (의도).
  # {CLIENT} 실제 OASIS 로그 샘플 확보 시 본 패턴을 정교화한다.
  # {CLIENT} 공통 logback 라인(dmes-logback-base.xml LOG_PATTERN) 기준 — service 1자 이상(HTTP 노이즈 제외, D7)
  lex_pattern: "(?<time>20\\d\\d-\\d\\d-\\d\\d \\d\\d:\\d\\d:\\d\\d\\.\\d\\d\\d) \\[(?<thread>[^\\]]+)\\] \\[(?<serviceTag>[\\w:]+)\\] \\[(?<service>[^\\]]+)\\] (?<level>(?:TRACE|DEBUG|INFO|WARN|ERROR))\\s+(?<logger>[\\w.$-]+) - (?<message>.*)"
  extraction:
    service_finish:
      start_with_match: "Service end - service name "
      run_time_pattern: "RunTime : \\[(?<runTime>\\d+)\\]\\s*$"
    # cactus OasisServiceExecutor 가 서비스 시작 때 남기는 "serviceId/action" 줄(예: ruleCalc/view)을 파싱한다.
    # 로그 문구를 바꾸면 이 패턴도 함께 맞춘다. start_with_match 는 ServiceListExtraction 에서 null 확인에만 쓰이고
    # 실제 판정은 action_pattern(메시지 전체 일치)이 한다.
    service_action:
      start_with_match: "serviceId/action"
      action_pattern: "^[\\w.-]+/(?<action>\\w+)$"
  config_file: "classpath:analog-serializer.json"
