plugins {
    id 'java'
    id 'war'
    alias(libs.plugins.spring.boot)
    alias(libs.plugins.spring.dependency.management)
    id 'dmes.test-conventions'
}

group = 'com.dongkuk.caravan'
version = '1.0.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.add('-parameters')
}

def nexusUrl = "http://172.31.1.96:8889/nexus"

// ── Apache Camel 4.20 (Spring Boot 4.x 지원은 Camel 4.19+; PoC-2b WildFly 실배포 검증 완료) ──
dependencyManagement {
    imports {
        mavenBom "org.apache.camel.springboot:camel-spring-boot-bom:${libs.versions.camel.get()}"
    }
}

repositories {
    mavenCentral()
    mavenLocal()
    // maven {
    //     url "${nexusUrl}/content/groups/public"
    //     allowInsecureProtocol = true
    //     content {
    //         includeGroup 'com.dongkuk'
    //         includeGroup 'com.dongkuk.dmes'
    //         includeGroup 'com.dongkuk.caravan'
    //     }
    // }
}

bootRun {
    // local SQLite 경로 ../data/caravan-*.db 의 기준을 caravan-hub 모듈 루트로 통일한다.
    workingDir = rootProject.projectDir
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

dependencies {
    // Caravan Kafka Library
    implementation libs.caravan.core

    // ── Apache Camel ──
    //   core: CamelContext 자동구성 / sql: 인바운드·아웃바운드 DB(onConsume 낙관락, P3-DB/P4)
    //   jackson: 메시지 (un)marshal / servlet: 인바운드 HTTP(P3-HTTP, /caravanHubApi/*).
    //   http·sftp starter 는 아웃바운드/FILE 단계(P3-FILE/P4)에서 추가.
    implementation libs.camel.spring.boot.starter
    implementation libs.camel.sql.starter
    implementation libs.camel.jackson.starter
    implementation libs.camel.servlet.starter

    // Spring Boot (버전은 dependency-management BOM 에서 관리)
    implementation libs.spring.boot.starter.web
    implementation libs.spring.boot.starter.validation
    implementation libs.spring.boot.starter.jdbc
    // Actuator (/actuator/health — 타 모듈(mpn/mls/mpp/mqc/analog)과 톤 통일)
    implementation libs.spring.boot.starter.actuator

    // MyBatis
    implementation libs.mybatis.spring.boot.starter.v305

    // JSch (SFTP)
    implementation libs.jsch

    // Caffeine Cache
    implementation libs.caffeine.v320

    // ── DB Drivers (옵셔널 프로파일별 활성화) ──
    runtimeOnly libs.sqlite.jdbc
    providedRuntime libs.mssql.jdbc   // JNDI 전환(2026-07-09): WildFly 모듈 제공, WAR 제외. bootRun(runtimeClasspath)엔 잔존

    // WildFly(외장 WAS) 의 서블릿 컨테이너를 사용 → 내장 Tomcat 은 provided 처리.
    // bootWar 가 WEB-INF/lib = runtimeClasspath − providedRuntime 으로 계산하므로
    // starter-web 이 transitive 로 끌어온 Tomcat 도 WEB-INF/lib-provided 로 격리되어 배포 안 됨.
    // 주의: starter-tomcat 전체를 빼면 SF7/SB4 에서 spring-web 까지 runtimeClasspath 에서 누락되어
    //       로컬 bootRun/IDE 실행이 깨진다. 내장 서블릿 컨테이너 jar(tomcat-embed-*)만 provided 로 뺀다.
    providedRuntime libs.tomcat.embed.core
    providedRuntime libs.tomcat.embed.el
    providedRuntime libs.tomcat.embed.websocket

    // Lombok
    compileOnly libs.lombok.base
    annotationProcessor libs.lombok.base

    // Test
    testImplementation libs.spring.boot.starter.test
    testCompileOnly libs.lombok.base
    testAnnotationProcessor libs.lombok.base
}

tasks.named('test') {
    useJUnitPlatform()
}

bootWar {
    archiveFileName = 'caravan-hub.war'
}

// PC 전역 테스트 슬롯 — 같은 PC 에서 동시에 도는 Test 태스크를 DMES_TEST_SLOTS(기본 2)개로 묶는다(../gradle/test-slot.gradle).
apply from: file('../gradle/test-slot.gradle')
