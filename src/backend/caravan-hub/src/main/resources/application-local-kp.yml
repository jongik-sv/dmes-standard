# ────────────────────────────────────────────────────────────────────────────
# local-kp: 김포 개발 DB 직결 (bootRun/IDE 전용, Hikari) — 구 application-dev.yml(직결) 이관 (2026-07-09)
#  ⚠️ 신 application-dev.yml 은 WildFly JNDI 프로파일로 역할이 바뀌었다 (직결 아님).
#  - DB 접속: mcm local-kp 와 동일 서버(172.16.2.154:5010 / ksm_dmes). USER=스키마 분리.
#      · mst (@Primary): CARAVANUSER — Kafka 도메인(라우팅 + caravan 메타).
#      · if          : EAIUSER    — 인터페이스 IF_* 테이블.
#  - Kafka : 김포측 브로커(172.16.2.154:9092, 구 dev 값 유지).
#  사용: -Dspring.profiles.active=local-kp (단독)
# ────────────────────────────────────────────────────────────────────────────
spring:
  datasource:
    mst:
      driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
      jdbc-url: jdbc:sqlserver://172.16.2.154:5010;databaseName=ksm_dmes;encrypt=false;trustServerCertificate=true
      username: CARAVANUSER
      password: CARAVANUSER_DEV
      hikari:
        maximum-pool-size: 10
        minimum-idle: 2
        connection-timeout: 30000
    if:
      driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
      jdbc-url: jdbc:sqlserver://172.16.2.154:5010;databaseName=ksm_dmes;encrypt=false;trustServerCertificate=true
      username: EAIUSER
      password: EAIUSER_DEV
      hikari:
        maximum-pool-size: 10
        minimum-idle: 2
        connection-timeout: 30000

# caravan EMF (=@Primary mst = CARAVANUSER) — MSSQL dialect + dev 부트스트랩(테이블 자동 생성)
caravan:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:172.16.2.154:9092}
  hibernate:
    dialect: org.hibernate.dialect.SQLServerDialect
    ddl-auto: update     # CARAVANUSER 에 TB_MCM_MOM_KAFKA_TOPICS / TB_MCM_MOM_TC_ERROR 자동 생성(구 dev 값 유지)
