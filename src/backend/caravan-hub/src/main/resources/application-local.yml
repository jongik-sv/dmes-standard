# ────────────────────────────────────────────────────────────────────────────
# 로컬 개발 프로파일 (oracle-1007)
#  - DB: 로컬 Oracle PDB 듀얼 DataSource (mst=CARAVANUSER, if=EAIUSER). 접속값은 DMES_ORA_*(docs/oracle-1007/schema-owners.md §3).
#    PDB 는 `scripts/oracle/pdb.sh` 로 만들고 `be-run.sh --pdb=<PDB>` 로 접속값을 넘긴다. 없으면 FREEPDB1.
#  - 스키마: HubFlywayConfig 가 CARAVANUSER(db/migration/caravanuser)와 IFUSER(db/migration/ifuser, 로컬 전용)를 적용한다.
#  - Kafka: 같은 backend 의 localKafka 모듈(임베디드 Kafka, localhost:9092)
# ────────────────────────────────────────────────────────────────────────────
caravan:
  kafka:
    bootstrap-servers: localhost:9092
  hibernate:
    # caravan EMF(=@Primary mst=CARAVANUSER)는 Flyway 가 만든 표를 쓴다. 표를 만들거나 고치지 않는다.
    ddl-auto: none

spring:
  # DataSourceConfig 가 spring.datasource.{mst,if} 를 HikariDataSource 에 직접 바인딩하므로 풀 설정은 hikari: 아래가 아니라 mst:·if: 바로 아래에 둔다.
  datasource:
    mst:
      jdbc-url: ${DMES_ORA_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
      username: CARAVANUSER
      password: ${DMES_ORA_PASSWORD:dmes_password_123}
      maximum-pool-size: 3     # Oracle 인스턴스를 모든 레인이 공유한다
      minimum-idle: 1
      connection-timeout: 30000
    if:
      jdbc-url: ${DMES_ORA_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
      username: EAIUSER          # 표 없이 접속만 하는 사용자 — IFUSER 표에 SELECT·INSERT·UPDATE 권한을 받는다
      password: ${DMES_ORA_PASSWORD:dmes_password_123}
      maximum-pool-size: 3
      minimum-idle: 1
      connection-timeout: 30000

caravan-hub:
  flyway:
    ifuser:
      enabled: true
      url: ${DMES_ORA_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
      username: IFUSER
      password: ${DMES_ORA_PASSWORD:dmes_password_123}

logging:
  file:
    name: ./app.log
