# ── wildfly: JNDI datasource 블록 (dev/prod 공통 — 단독 활성 금지) ──
# 2026-07-09 JNDI 전환 (docs/framework/DataSource_JNDI설계.md — mcm 패턴 확산 1호).
# application.yml 의 spring.profiles.group 으로 dev|prod 활성 시 자동 포함된다.
#
# 원칙:
#  - jdbc-url/username/password/driver 전부 없음 — 물리 접속·풀은 각 WildFly(domain.xml 프로파일) 소유.
#  - mcm 이 등록한 논리 DS 를 재사용 (사용자 결정 2026-07-09):
#      mst → java:/jdbc/mcm/dsCaravan (CARAVANUSER — Kafka 도메인)
#      if  → java:/jdbc/mcm/dsIF      (EAIUSER — 인터페이스 IF_*)
#    caravan-hub 전용 서버그룹이 mcm 과 같은 domain 프로파일을 쓰면 자동으로 존재.
#  - 반드시 jta="false" 로 정의 (resource-local 트랜잭션 충돌 방지).
#  - ${PROP:기본값} 형태 — 다른 이름의 DS 를 써야 할 때만 override: mst 는 JNDI_DS_MST 또는 JNDI_DS_CARAVAN(mcm 과 같은 이름), if 는 JNDI_DS_IF(mcm 과 공통).
# ⚠️ JNDI 이름은 mcm 의 application-wildfly.yml 과 같아야 한다(mcm a3 에서 java:/jdbc/mcm/* 로 바뀌어 함께 맞췄다).
# Kafka 브로커는 여기 두지 않는다 — 환경 차이값이므로 application-dev/prod.yml 소유.
spring:
  # 스키마는 DBA 가 db/migration/caravanuser 의 V 파일로 사전 생성한다 — 기동 시 Flyway 를 돌리지 않는다.
  flyway:
    enabled: false
  datasource:
    mst:
      jndi-name: "${JNDI_DS_MST:${JNDI_DS_CARAVAN:java:/jdbc/mcm/dsCaravan}}"
    if:
      jndi-name: "${JNDI_DS_IF:java:/jdbc/mcm/dsIF}"

# caravan EMF (=@Primary mst = CARAVANUSER) — Oracle(Hibernate 자동 감지). 스키마는 DBA 가 V 파일로 만든다 → none
caravan:
  hibernate:
    ddl-auto: none
