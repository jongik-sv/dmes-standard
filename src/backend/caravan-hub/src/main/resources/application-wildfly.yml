# ── wildfly: JNDI datasource 블록 (dev/prod 공통 — 단독 활성 금지) ──
# 2026-07-09 JNDI 전환 (docs/framework/DataSource_JNDI설계.md — mcm 패턴 확산 1호).
# application.yml 의 spring.profiles.group 으로 dev|prod 활성 시 자동 포함된다.
#
# 원칙:
#  - jdbc-url/username/password/driver 전부 없음 — 물리 접속·풀은 각 WildFly(domain.xml 프로파일) 소유.
#  - mcm 이 등록한 논리 DS 를 재사용 (사용자 결정 2026-07-09):
#      mst → java:/jdbc/mssql/mcm/dsCaravan (CARAVANUSER — Kafka 도메인)
#      if  → java:/jdbc/mssql/mcm/dsIF      (EAIUSER — 인터페이스 IF_*)
#    caravan-hub 전용 서버그룹이 mcm 과 같은 domain 프로파일을 쓰면 자동으로 존재.
#  - 반드시 jta="false" 로 정의 (resource-local 트랜잭션 충돌 방지).
#  - ${PROP:기본값} 형태 — 다른 이름의 DS 를 써야 할 때만 JNDI_DS_MST/JNDI_DS_IF 로 override.
# Kafka 브로커는 여기 두지 않는다 — 환경 차이값이므로 application-dev/prod.yml 소유.
spring:
  datasource:
    mst:
      jndi-name: "${JNDI_DS_MST:java:/jdbc/mssql/mcm/dsCaravan}"
    if:
      jndi-name: "${JNDI_DS_IF:java:/jdbc/mssql/mcm/dsIF}"

# caravan EMF (=@Primary mst = CARAVANUSER) — MSSQL dialect. 스키마 안정화 → none (신규 테이블은 DDL 관리)
caravan:
  hibernate:
    dialect: org.hibernate.dialect.SQLServerDialect
    ddl-auto: none
