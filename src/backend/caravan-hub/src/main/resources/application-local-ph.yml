# ────────────────────────────────────────────────────────────────────────────
# local-ph: 포항 개발 Oracle 직결 (bootRun/IDE 전용, Hikari) — oracle-1007 에서 MSSQL 에서 Oracle 로 전환
#  듀얼 DataSource (USER=스키마 분리). 접속값은 환경 변수로 받고 저장소에는 두지 않는다(필수, 기본값 없음).
#  - mst (@Primary): CARAVANUSER — Kafka 도메인. TB_CARAVAN_HUB_CONFIG(라우팅) + caravan 메타(TB_CARAVAN_TOPICS / TB_CARAVAN_TC_ERROR).
#  - if : EAIUSER    — 인터페이스 IF_* 테이블(IFUSER 소유) 접속 전용.
#  - 스키마는 DBA 가 db/migration/caravanuser·ifuser 의 V 파일로 만든다(spring.flyway.enabled=false).
#  - Kafka: 포항 개발 브로커.
#  환경 변수: CARAVAN_HUB_ORA_URL(jdbc:oracle:thin:@//호스트:포트/서비스) · CARAVAN_HUB_MST_PASSWORD · CARAVAN_HUB_IF_PASSWORD
#  사용: -Dspring.profiles.active=local-ph (단독)
# ────────────────────────────────────────────────────────────────────────────
spring:
  flyway:
    enabled: false
  datasource:
    mst:
      jdbc-url: ${CARAVAN_HUB_ORA_URL}
      username: CARAVANUSER
      password: ${CARAVAN_HUB_MST_PASSWORD}
      hikari:
        maximum-pool-size: 10
        minimum-idle: 2
        connection-timeout: 30000
    if:
      jdbc-url: ${CARAVAN_HUB_ORA_URL}
      username: EAIUSER
      password: ${CARAVAN_HUB_IF_PASSWORD}
      hikari:
        maximum-pool-size: 10
        minimum-idle: 2
        connection-timeout: 30000

caravan:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:10.10.80.48:9092,10.10.80.48:9094,10.10.80.48:9096}   # 포항 개발 브로커
    replication-factor: 3       # 3브로커 클러스터(10.10.80.48) 토픽 RF=3 — caravan-hub.war 재빌드본 필요
  hibernate:
    ddl-auto: none       # 스키마는 Flyway V 파일(DBA 적용) 기준 — 부팅 시 표를 만들거나 고치지 않는다
