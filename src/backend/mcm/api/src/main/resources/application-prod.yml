# ── prod: 운영계 WildFly (JNDI) — 환경 차이값만 ──
# 2026-07-07 JNDI 전환 설계 §4-5 (docs/framework/DataSource_JNDI설계.md).
# datasource 는 wildfly 프로파일(application-wildfly.yml, group 자동 활성)이 정의 —
# 구 방식(DB_URL/CARAVANUSER_DB_URL 등 env 직결)은 폐기. 물리 접속은 운영 WildFly standalone.xml 소유
# (비밀번호는 Elytron credential-store 권장, 설계서 §5-4).
# 기동: WildFly JAVA_OPTS 에 -Dspring.profiles.active=prod
spring:
  jpa:
    show-sql: false            # 운영: SQL 로깅 OFF

cactus:
  jwt:
    secret: ${JWT_SECRET}                    # 운영 env var 의무 — 기본값 없음(미주입 시 fail-fast)
  security:
    client-key: ${BACKEND_CLIENT_KEY}        # 운영 env var 의무

# ── DataInitializer — 운영은 항상 끔 ──
dmes:
  init:
    enabled: false
  # ── 쿼리 위젯은 전용 읽기 DataSource 에서만 실행 (oracle-1007, mcm-core c3 정책 B) ──
  # dmes.widget.query.datasource(jndi-name·url)가 없으면 위젯 SQL 실행을 거절한다 — 앱 기본 계정으로 도는 일을 막는다.
  # 이 키를 읽는 코드는 mcm-core(ora-mcm-core c3, 10d9b67de)에 있다 — 그 커밋이 들어가기 전에는 무시된다.
  # wildfly 프로파일에 두지 않은 까닭: dev 도 그룹으로 wildfly 를 켜고, 그룹 멤버가 dev 를 덮으므로 dev 까지 켜진다.
  widget:
    query:
      require-dedicated: ${WIDGET_QUERY_REQUIRE_DEDICATED:true}   # 운영에서 급히 끌 때 env 로 false
  # 예약 작업 모듈 호출 주소 — 운영은 환경 변수로 LB 주소를 준다(MDM_WAS_URL 등 기존 관례). 이 파일에는 값을 두지 않는다.
  #   job.modules.<모듈>.base-url 을 따로 줘야 하면(BFF 가 보는 주소와 MCM 이 보는 주소가 다를 때) 그때 여기에 환경 변수로 쓴다.

logging:
  level:
    root: WARN
    com.dongkuk.dmes.cactus: INFO
    com.dongkuk.dmes.mcm: INFO
    org.hibernate.SQL: WARN
