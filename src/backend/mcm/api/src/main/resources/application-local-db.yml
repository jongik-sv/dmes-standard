# ── local-db: 외부 RDB(SQL Server) 직결 (bootRun/IDE 전용, Hikari) ──
# 표준 템플릿 프로파일. 접속 정보는 코드에 박지 않고 전부 환경변수로 주입한다
# (DB_HOST / DB_PORT / DB_NAME / DB_USERNAME / DB_PASSWORD ...).
# 값이 없으면 기동이 실패하도록 기본값을 두지 않았다 — 실 고객사 프로젝트에서
# 개발계 기본값을 넣고 싶으면 이 파일을 복제해 사이트별 프로파일을 만든다.
#
# local(SQLite 단독)과 상호배타 — 반드시 하나만 활성한다.
#   실행 예) ./gradlew bootRun --args='--spring.profiles.active=local-db'
spring:
  datasource:                  # biz — MCMAPUSER 스키마
    url: jdbc:sqlserver://${DB_HOST}:${DB_PORT:1433};databaseName=${DB_NAME};encrypt=false;trustServerCertificate=true
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    database-platform: org.hibernate.dialect.SQLServerDialect
    hibernate:
      # 개발계에서 엔티티 변경을 자동 반영(테이블/컬럼 추가·변경. 삭제는 하지 않음).
      # 운영계는 wildfly 프로파일이 none 으로 덮는다.
      ddl-auto: update
    show-sql: true

cactus:
  caravan-hub:
    base-url: ${CARAVAN_HUB_BASE_URL:http://localhost:8200}
  jwt:
    secret: ${JWT_SECRET}
  security:
    client-key: ${BACKEND_CLIENT_KEY}
  # ── 멀티 DS — 단일 DB, USER=스키마 분리 (biz / cmn / if / caravan) ──
  datasource:
    extras:
      cmn:                     # 공통 — 물리는 biz 와 동일 스키마
        url: ${CMN_DB_URL:jdbc:sqlserver://${DB_HOST}:${DB_PORT:1433};databaseName=${DB_NAME};encrypt=false;trustServerCertificate=true}
        username: ${CMN_DB_USERNAME:${DB_USERNAME}}
        password: ${CMN_DB_PASSWORD:${DB_PASSWORD}}
        driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
        maximum-pool-size: 5
      if:                      # 인터페이스 송수신 — EAI 스키마
        url: ${IF_DB_URL:jdbc:sqlserver://${DB_HOST}:${DB_PORT:1433};databaseName=${DB_NAME};encrypt=false;trustServerCertificate=true}
        username: ${IF_DB_USERNAME}
        password: ${IF_DB_PASSWORD}
        driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
        maximum-pool-size: 5
      caravan:                 # Kafka 메타 — caravan-console 스키마
        url: ${CARAVAN_DB_URL:jdbc:sqlserver://${DB_HOST}:${DB_PORT:1433};databaseName=${DB_NAME};encrypt=false;trustServerCertificate=true}
        username: ${CARAVAN_DB_USERNAME}
        password: ${CARAVAN_DB_PASSWORD}
        driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
        maximum-pool-size: 5
  jpa:
    extras:
      cmn:
        hibernate:
          dialect: org.hibernate.dialect.SQLServerDialect
          ddl-auto: none       # 빈 PU — 스키마 무접촉
      if:
        hibernate:
          dialect: org.hibernate.dialect.SQLServerDialect
          ddl-auto: none       # CREATE 권한 없는 계정 전제 — 스키마 사전 생성
      caravan:
        hibernate:
          dialect: org.hibernate.dialect.SQLServerDialect
          ddl-auto: none       # 동일

# ── DataInitializer 실행 (개발계 — 초기 시드/스키마 적재 수행) ──
dmes:
  init:
    enabled: true

caravan-console:
  caravanhub:
    base-url: ${CARAVAN_HUB_BASE_URL:http://localhost:8200}
