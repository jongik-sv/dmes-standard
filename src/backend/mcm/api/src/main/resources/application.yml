spring:
  application:
    name: mcm

  # ── 프로파일 체계 ──
  #   local    : 로컬 Oracle PDB 직결 (bootRun/IDE) — 프로파일 미지정 기동은 McmApplication 의 spring.profiles.default=local 폴백
  #   dev      : 개발계 WildFly — JNDI (아래 group 으로 wildfly 자동 활성)
  #   prod     : 운영계 WildFly — JNDI
  # local(직결)과 dev/prod(JNDI)는 상호배타 — 반드시 하나만 활성.
  # 옛 local-db(SQL Server 직결)는 oracle-1007(2026-10-07)에 archive 했다(src/backend/mcm/archive/api/src/main/resources/).
  profiles:
    group:
      dev: [wildfly]
      prod: [wildfly]

  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        # packagesToScan 라인 폐기 (2026-05-20) — JpaConfig.setPackagesToScan 이 정본. 중복/혼선 회피.
        # ── Hibernate StatementInspector — native INSERT/UPDATE audit 9 컬럼 자동 주입 (2026-06-01) ──
        # 대상 = MCMAPUSER.TB_MCM_* prefix 만. idempotent (C_USR_ID/U_USR_ID 이미 명시되어 있으면 skip).
        # DataInitializer 수동 audit 명시는 보존, JPA Repository.save 등 hibernate 가 생성한 SQL 에만 주입.
        session_factory:
          statement_inspector: com.dongkuk.dmes.mcm.common.audit.McmAuditStatementInspector

  # ── Spring Boot Flyway 자동 구성은 끈다 (oracle-1007, 2026-10-07) ──
  # mcm 의 스키마 MCMAPUSER·MCM_SOURCE·MCM_BACKUP·MCAAPUSER 는 스키마마다 그 주인으로 접속하는 Flyway 4개가 필요한데,
  # spring.flyway 는 접속 하나뿐이다. 그래서 여기서는 끄고 McmFlywayConfig(dmes.flyway.enabled)가 스키마별로 돌린다.
  # V 파일 정본: mcm-core src/main/resources/db/migration/oracle/<스키마 소문자>/ (스키마 소유표 docs/oracle-1007/schema-owners.md).
  # 켜 두면 기본 locations(classpath:db/migration)를 재귀로 훑어 네 스키마 폴더를 한 이력에 섞는다.
  # local 은 dmes.flyway.enabled=true(application-local.yml), WildFly(dev/prod)는 false — DBA 가 같은 V 파일을 적용한다.
  flyway:
    enabled: false

  # ── 미디어 위젯 파일 올리기 한도 (스펙 2026-10-02-widget-admin-generic §4.3) ──
  # 동영상 100MB 까지 받는다(이미지 10MB 는 WidgetMediaStorage 가 따로 거른다). 요청 한도는 파일 + multipart 머리말 여유 1MB.
  # resolve-lazily: 본문을 컨트롤러 인자 해석 때 읽는다 — 상한을 넘으면 WidgetMediaController 의 처리기가 400 과 스펙 문구
  # 「이미지는 10MB, 동영상은 100MB 까지 올릴 수 있습니다」를 돌려준다(아니면 핸들러를 찾기 전에 터져 전역 500 이 된다).
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 101MB
      resolve-lazily: true

server:
  # 로컬 bootRun/IDE 실행 포트. WAR(WildFly) 배포 시엔 무시되고 WildFly http 포트(8100)를 사용.
  port: 8100
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
      force-response: true

# ── Cactus 설정 ──
cactus:
  auth:
    enabled: true
  jwt:
    secret: Y2FjdHVzLXNhbXBsZS1zZWNyZXQta2V5LWZvci10ZXN0aW5nLW9ubHktMjAyNg==
    issuer: mcm
    access-token-expiry: 28800   # 8h
    refresh-token-expiry: 604800 # 7d
  security:
    max-login-failures: 5
    client-key: dmes-bff-local-client-key-2026
    # WS 핸드셰이크는 브라우저 직결(X-Client-Key 없음) — ClientKeyFilter skip (설계 §4.2).
    # ⚠️ override 시 default 3종이 통째로 대체되므로 전부 나열 (ClientKeyFilter.java:85-87).
    # ⚠️ @Value 플레이스홀더 바인딩이라 YAML 리스트 불가 — 콤마 문자열로 기재.
    client-key-skip-paths: /auth/,/api/auth/,/actuator/,/ws/
  oasis:
    service-group: mcm
    service-path: /services    # classpath root 의 services/** 매칭
    transactional: true
    cache:
      size: 100                # BPMN parsing cache size (R-multi-22 fix — CactusCachingServiceProvider)
  # ── MDM 메타 캐시(spec docs/superpowers/specs/2026-10-02-mdm-meta-cache-design.md §5.1) ──
  #  MDM(8096)에서 컬럼·도메인·룰·룰세트·코드·전문 정의를 받아 이 인스턴스에 캐시하고 10초마다 변경 기록을 확인한다.
  #  끄려면 MDM_CACHE_ENABLED=false. client-key 는 MDM 이 받는 BACKEND_CLIENT_KEY 와 같아야 한다.
  mdm:
    enabled: ${MDM_CACHE_ENABLED:true}
    module: mcm
    system-code: MES,MDM  # 컬럼 별칭 매칭에 쓰는 MDM 시스템 코드 목록(표준 물리명으로 못 찾으면 앞 코드부터 그 시스템의 별칭으로 찾는다). MDM 은 MDM 화면 키용(2026-10-05)
    base-url: ${MDM_WAS_URL:http://localhost:8096}
    client-key: ${BACKEND_CLIENT_KEY:dmes-bff-local-client-key-2026}
    poll-interval: 10s
    max-entries: 20000
    max-age: 24h         # 적재 뒤 절대 상한 — 조회가 많아도 이 시간 뒤에는 MDM 에서 다시 받는다
    max-idle: 60m        # 마지막 조회 뒤 이 시간 동안 조회가 없으면 만료(조회될 때마다 연장)
    connect-timeout: 2s
    read-timeout: 5s
  # ── caravan-hub 통합 클라이언트 (DefaultCaravanHubIntegrationClient → POST {base-url}/caravanHubApi/v1/send) ──
  #   코드 하드코딩 기본값(SeraiClientProperties.baseUrl=http://localhost:8200) 대신 yml/env 로 주입한다.
  #   운영/개발계는 CARAVAN_HUB_BASE_URL 환경변수로 override 한다.
  caravan-hub:
    base-url: ${CARAVAN_HUB_BASE_URL:http://localhost:8200}
    auth:
      client-key: ${CARAVAN_HUB_CLIENT_KEY:dmes-bff-local-client-key-2026}
  # ── 1.0.21 multi-tx (옵션 β + δ) ──
  datasource:
    primary-alias: biz         # Spring Boot dataSource 빈을 'biz' alias (옵션 β)
  jpa:
    extras:
      cmn:                     # 공통 DS — 표준 3종 통일(2026-07-07). MCM 은 물리적으로 biz 와 동일 MCMAPUSER
        packages-to-scan: []   # 현재 cmn EMF 에 매핑할 엔티티 없음 (mpn 과 동일 패턴)
        persistence-unit-name: cactus-cmn
      if:                      # 인터페이스 송수신 DS — EAIUSER (운영·로컬 Oracle PDB)
        packages-to-scan: []   # pilot 제거(2026-06-05) — 현재 if EMF 에 매핑할 엔티티 없음
        persistence-unit-name: cactus-if
      caravan:                 # Kafka 메타 DS — CARAVANUSER (운영·로컬 Oracle PDB). caravan-console 메타 entity 3종
        packages-to-scan:
          - com.dongkuk.caravan.console.host        # AppHostEntity (TB_CARAVAN_APPHOST)
          - com.dongkuk.caravan.console.caravanhubconfig # ConsoleCaravanHubConfigEntity (TB_CARAVAN_HUB_CONFIG)
          - com.dongkuk.caravan.console.topic       # ConsoleTopicInfoEntity (TB_CARAVAN_TOPICS)
        persistence-unit-name: cactus-caravan
  tx:
    managers:                  # 옵션 δ — 표준 3개(txBiz/txCmn/txIF) 의무 + txCaravan(MCM 전용, MCM yml 에만 존재)
      txBiz:
        data-source: biz       # MCMAPUSER (mcm 자체 DB, primary-alias)
      txCmn:
        data-source: cmn       # 표준 통일(2026-07-07) — 구 "biz alias 매핑" 폐기. 독립 cmn DS (물리는 동일 MCMAPUSER)
      txIF:
        data-source: if        # 인터페이스 송수신 (EAIUSER)
      txCaravan:
        data-source: caravan   # Kafka 메타 (CARAVANUSER) — caravan-console 메타 repo 전용. @Transactional("txCaravan") 가능
    default-manager: txBiz     # CactusTxProperties.defaultManager (yml `default` 는 Java 예약어라 매핑 불가)


# ── mcm-core 비밀번호 정책 ──
# 템플릿 기본값은 전부 꺼둔 상태다. 실 프로젝트 착수 시 expiry/history/min-length/complexity 를 반드시 켤 것.
mcm:
  security:
    # SYSADMIN 브레이크글라스 (2026-07-30 순수 RBAC 전환 — docs/framework/BFF-RBAC-SYSADMIN프리패스제거-상세설계.md)
    # false(기본) = SYSADMIN 도 TB_MCM_SEC_ROLE_MAPPING 멤버십으로 판정.
    # true = 舊 전면통과 복원 (긴급 복구 전용 — JVM: -Dmcm.security.sysadmin-freepass=true)
    sysadmin-freepass: false
  password:
    expiry-days: 0          # 만료 검증 끔
    history-count: 0        # 마지막 N개 비교 끔
    min-length: 0           # 길이 검증 끔
    complexity-pattern: ""  # 복잡도 검증 끔
    legacy-grace-days: -1
  # ── BE → BFF 권한 캐시 무효화(RoleChangedEventListener, 2026-10-03 보안 지적) ──
  #  두 값이 다 있어야 부른다. 하나라도 비면 부르지 않고 BFF 캐시 TTL(5분)로 반영된다. 코드 기본값은 없다(옛 http://localhost:3000 제거).
  #  internal-secret 은 BFF 의 BFF_INTERNAL_SECRET 과 같은 값 — X-Bff-Internal-Secret 헤더로 싣는다.
  #  마스터 비밀(BACKEND_CLIENT_KEY)과 다른 값이어야 한다(같으면 BFF 가 거절한다). 로컬 값은 application-local.yml.
  bff:
    invalidate-role-url: ${BFF_INVALIDATE_ROLE_URL:}
    internal-secret: ${BFF_INTERNAL_SECRET:}

# ── dmes 자체 설정 (최상위 dmes 키는 여기 하나만 둔다 — 같은 최상위 키가 둘이면 기동이 실패한다) ──
dmes:
  # ── 기본 DataSource 연결 지연 획득 (docs/oracle-1007/design-mcm-lazy-ds.md) ──
  # true 면 JpaConfig 가 기본 DataSource 를 LazyConnectionDataSourceProxy 로 감싼다 — 트랜잭션이 시작돼도 첫 SQL 때 풀에서 연결을 받아,
  # SQL 없이 OASIS txBiz 를 내려놓고 LLM 을 기다리는 위젯 채팅이 그동안 연결을 쥐지 않는다. 기본은 끔(운영 적용은 사용자 결정 대기),
  # local 은 켠다. 문제가 생기면 이 값을 false 로 두면 전과 같다(환경변수 DMES_DATASOURCE_LAZY_CONNECTION).
  datasource:
    lazy-connection: ${DMES_DATASOURCE_LAZY_CONNECTION:false}
  # ── 클라이언트 IP 판정 (화면 사용 기록 등) ──
  # trusted-proxies = X-Forwarded-For 를 믿을 직전 홉 IP 목록(쉼표 구분, CIDR 미지원).
  # 운영에서는 BFF 와 NGINX 의 IP 를 반드시 추가한다. 목록에 없으면 헤더를 무시하고 remoteAddr 를 쓴다.
  client-ip:
    trusted-proxies: 127.0.0.1,::1

  # ── 위젯 (스펙 2026-10-02-widget-admin-generic) ──
  widget:
    # 미디어 위젯 파일 본체 폴더(§4.3). 실행 폴더 기준 상대 경로 — bootRun 은 src/backend/mcm. 없으면 첫 올리기 때 만든다.
    # 파일 이름은 FILE_ID(32자 16진수)만 쓴다. 운영계는 공유 디스크 절대 경로로 바꾼다.
    media-dir: ./data/widget-media
    # 쿼리 위젯 실행기(§7) 전용 DataSource — 선택. 모두 비우면 앱 기본 DataSource 를 쓴다.
    # 운영에서는 여기에 **읽기 권한만 가진 DB 계정**을 붙인다(근본 대책). 실행기는 어느 DataSource 든 실행마다 읽기 전용
    # (연결 readOnly·늘 롤백·PostgreSQL/Oracle SET TRANSACTION READ ONLY)을 걸지만 보조 방어선일 뿐이다 —
    # SQL Server 는 읽기 전용 트랜잭션이 없고, Oracle 은 자율 트랜잭션 함수가 롤백을 벗어난다.
    # jndi-name(WildFly 컨테이너 풀)이 있으면 그것, 없고 url 이 있으면 직결 풀(widget-query). url 없이 계정만 넣으면 기동이 멈춘다
    # (기본 DataSource 로 물러나지 않는다). 비밀번호는 환경변수로만 넣는다 — 주소·계정·비밀번호는 로그에 남기지 않는다.
    query:
      datasource:
        jndi-name: ${WIDGET_QUERY_DS_JNDI:}
        url: ${WIDGET_QUERY_DS_URL:}
        username: ${WIDGET_QUERY_DS_USERNAME:}
        password: ${WIDGET_QUERY_DS_PASSWORD:}
        driver-class-name: ${WIDGET_QUERY_DS_DRIVER:}
        maximum-pool-size: 5
    # 환율·날씨 위젯(§8). 기본은 키 없는 공개 API. 서버가 밖으로 나갈 수 없는 망이면 enabled: false 로 끈다
    # (위젯은 「외부 정보를 불러오지 못했습니다」를 보인다).
    ext:
      enabled: true
      exchange:
        provider: frankfurter                # frankfurter(유럽중앙은행, 키 없음) | koreaexim(한국수출입은행, 키 필요)
        frankfurter-base-url: https://api.frankfurter.dev/v1
        koreaexim-key: ${WIDGET_KOREAEXIM_KEY:}   # 키는 환경변수로만 넣는다(로그·저장소에 남기지 않는다)
        koreaexim-base-url: https://oapi.koreaexim.go.kr/site/program/financial/exchangeJSON
        # 남용 막기 — 조회는 사용 중인 환율 위젯 정의의 통화·기간 안만 된다. 아래는 메모리 기록이라 인스턴스마다 따로 센다.
        user-fetch-limit: 10          # 사용자별로 외부 호출을 일으키는 요청 수 상한(구간마다). 넘으면 「환율 조회 요청이 너무 잦습니다」
        user-fetch-window-sec: 600    # 위 상한의 구간(초)
        retry-after-fail-sec: 600     # 실패·일부만 받음·오늘 값 없음 뒤 같은 통화·날짜를 다시 묻기까지(초). 지난 휴일은 그날 끝까지
      weather:
        base-url: https://api.open-meteo.com/v1/forecast
    # AI 챗봇 위젯(§9). provider 가 빈 값이면 가짜 공급자(정해진 답)로 동작한다.
    llm:
      provider: ${WIDGET_LLM_PROVIDER:}      # "" (가짜) | anthropic | openai(OpenAI 호환 — Ollama·vLLM 등 포함)
      base-url: ${WIDGET_LLM_BASE_URL:}      # openai 호환 서버 주소(예: http://localhost:11434/v1). anthropic 은 비워 둔다
      model: ${WIDGET_LLM_MODEL:}
      api-key: ${WIDGET_LLM_API_KEY:}        # 키는 환경변수로만 넣는다(toString·로그는 「설정됨」만 찍는다)
      timeout-sec: 60
      # 생각(thinking) 토큰도 한도에 들어가는 모델이 있어 1024 는 답이 잘리기 쉽다(Task 11 권고).
      max-tokens: 4096
      # 남용 막기(메모리·인스턴스마다 따로 센다). 하루 상한은 서울 날짜 기준, 도구 반복 포함 LLM 호출마다 1.
      daily-call-limit: 200      # 사용자별 하루 LLM 호출 수 상한 — 넘으면 「오늘 AI 챗봇 사용 한도(n회)를 모두 썼습니다」
      user-history-limit: 300    # 사용자별 저장 대화 기록 수(모든 인스턴스 합계) — 넘으면 가장 오래된 것부터 지운다
  # ── 예약 작업(docs/superpowers/specs/2026-10-08-job-scheduler-design.md §4.7) ──
  # MCM 앱만 server.enabled=true — 매분 판정·선점·모듈 호출·관리 화면. 모듈 앱(mdm 등)은 접수(/internal/job/run)만 한다.
  # modules.<모듈>.base-url 은 MCM 이 모듈을 부르는 주소이다. 기본값은 기존 <모듈>_WAS_URL 환경 변수 관례와 로컬 포트(워크트리 서버는 환경 변수로 덮어쓴다).
  # 모듈이 여러 대면 LB 주소를 준다(LB 는 /internal/job/run 을 다른 서버로 재시도하지 않게 설정 — nginx proxy_next_upstream off).
  job:
    module: mcm
    server:
      enabled: true
      batch-size: 50
    modules:
      mcm: { base-url: "${MCM_WAS_URL:http://localhost:8100}" }   # MCM 자신은 LocalJobRunGateway 로 직접 부르므로 쓰지 않는다
      mdm: { base-url: "${MDM_WAS_URL:http://localhost:8096}" }
      mpp: { base-url: "${MPP_WAS_URL:http://localhost:8094}" }
      mls: { base-url: "${MLS_WAS_URL:http://localhost:8092}" }
      mqc: { base-url: "${MQC_WAS_URL:http://localhost:8093}" }
      mpn: { base-url: "${MPN_WAS_URL:http://localhost:8095}" }
    http:
      allowed-hosts: []          # COLLECT(http) 원천이 부를 수 있는 호스트(정확 일치). 옛 키 dmes.widget.collect.allowed-hosts 도 함께 읽는다(warn)
    collect:
      enabled: true              # false 면 COLLECT 작업은 선점 후보에서 빠지고 mcm.collectPurge 는 아무것도 하지 않는다

# ── caravan-console 자체 설정 + Repository alias (kmc-core 0.2.0 패턴 B) ──
# caravan 의존 제거 (2026-05-12) — caravan-console.kafka.* / caravan.* 블록 삭제. caravan 라이브러리는 caravan-hub 호스트에서만 사용 (v4 정본).
caravan-console:
  # ── 콘솔 전송 테스트용 caravan-hub 클라이언트 (ConsoleCaravanHubClient → POST {base-url}/caravanHubApi/v1/send) ──
  #   cactus.caravan-hub 와는 별개 클라이언트(0.2.0 패턴 B — cactus 의존 제거)지만 호출 대상 허브는 동일하므로
  #   같은 환경변수를 공유한다. 미지정 시 ConsoleCaravanHubProperties 기본값 localhost:8200 으로 나가 ConnectException.
  #   override 예) JVM 옵션: -DCARAVAN_HUB_BASE_URL=http://<허브 호스트>:8200
  #                환경변수 : CARAVAN_HUB_BASE_URL=http://<허브 호스트>:8200
  caravanhub:
    base-url: ${CARAVAN_HUB_BASE_URL:http://localhost:8200}
    auth:
      client-key: ${CARAVAN_HUB_CLIENT_KEY:dmes-bff-local-client-key-2026}
  works-code: ${CARAVAN_CONSOLE_WORKS_CODE:p}        # caravan-console 인스턴스의 공장 식별자 (TB_CARAVAN_APPHOST.WORKS_CD 필터)
  message:
    max-browse-count: 200                 # 메시지 검색 1회 최대 행 수
  repository:                             # caravan-console 메타 Repository → caravan EMF/TxMgr (Kafka 스키마 CARAVANUSER)
    emf-bean: cactusEntityManagerFactoryCaravan
    tx-bean:  cactusTransactionManagerCaravan

# ── 로깅 ──
logging:
  level:
    root: INFO
    com.dongkuk.dmes.cactus: DEBUG
    com.dongkuk.dmes.mcm: DEBUG
    org.hibernate.SQL: DEBUG
    com.dongkuk.oasis.methodinvoker: WARN   # OASIS 메서드 해석(Try binding·Strategy) 요청마다 남는 INFO 를 끈다 — analog 가 쓰는 문구(Task·Process·Service·Invoking class)는 이 패키지에서 나오지 않는다(버리는 규칙 'has bound by name' 만 해당)
