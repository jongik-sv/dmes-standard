plugins {
    id 'org.springframework.boot'
    id 'war'
}

bootRun {
    // 모듈 루트를 작업 디렉터리로 고정한다. application.yml 의 상대 경로(../data)가 여기에 걸린다.
    workingDir = rootProject.projectDir
}

dependencies {
    api project(':lib')
    testImplementation testFixtures(project(':lib'))
    runtimeOnly files(project(':lib').sourceSets.main.output)

    // 외장 WAS 배포를 전제로 내장 톰캣은 provided 처리한다.
    providedRuntime libs.tomcat.embed.core
    providedRuntime libs.tomcat.embed.el
    providedRuntime libs.tomcat.embed.websocket
}

// 시험 PDB 하나를 lib·api 시험이 나눠 쓰고 시험마다 스키마를 Flyway clean 으로 다시 만든다(McmOraTestDb) — --parallel 에서도
// 두 Test 태스크가 겹치지 않게 순서를 건다(oracle-1007).
tasks.named('test') {
    mustRunAfter(':lib:test')
}

bootWar {
    archiveFileName = 'mcm.war'
}
