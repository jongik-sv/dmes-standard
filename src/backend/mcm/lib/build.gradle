plugins {
    id 'org.springframework.boot' apply false
    id 'io.spring.dependency-management'
    // Oracle 시험 공용 도우미(McmOraTestDb — 접속값·스키마 초기화)를 api 시험과 나눠 쓴다(oracle-1007).
    id 'java-test-fixtures'
}

dependencyManagement {
    imports {
        mavenBom org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES
    }
}

tasks.named('test') {
    useJUnitPlatform()
    // 시험 PDB 하나를 나눠 쓰고 시험마다 스키마를 다시 만든다 — 병렬 fork 하면 서로 지운다.
    maxParallelForks = 1
}

dependencies {
    api libs.cactus.core.v1020
    api libs.mcm.core
    api libs.caravan.console

    api libs.spring.boot.starter.actuator
    api libs.spring.boot.starter.data.jpa
    api libs.spring.boot.starter.security
    api libs.spring.boot.starter.web
    api libs.spring.boot.starter.validation

    api libs.ojdbc11
    api libs.flyway.database.oracle
    api libs.hibernate.community.dialects.v705

    // 샘플 스키마를 Flyway 로 관리한다.
    // Spring Boot 4 부터 FlywayAutoConfiguration 이 별도 모듈(spring-boot-flyway)로 빠졌다.
    api libs.flyway.core
    api libs.spring.boot.flyway

    // 공지 본문 HTML 소독(noticeMgmt save, CONTENT_FORMAT='HTML') — 2026-10-07 mls 에서 공지와 함께 옮겼다.
    // Spring Boot BOM 이 관리하지 않는 라이브러리라 버전은 libs.versions.toml 이 정한다.
    implementation libs.jsoup

    testFixturesImplementation libs.flyway.core
    testFixturesImplementation libs.flyway.database.oracle
    testFixturesImplementation libs.spring.boot.starter.data.jpa
}
