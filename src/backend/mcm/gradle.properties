# 빌드 부하·속도 설정(chore/gradle-tuning, 2026-09-26).
# 같은 PC 에서 D'Flow 팀원 여러 명이 워크트리마다 Gradle 게이트를 동시에 돌려 부하 평균이 20~30 까지 올랐다.
# gradle.properties 가 없어 기본값으로 돌았기 때문이다 — 워크트리마다 전 모듈을 처음부터 컴파일하고, 빌드 하나가 10코어를 다 썼다.
# 이 값들(org.gradle.*)은 Gradle 을 실행한 루트 빌드의 gradle.properties 에서만 읽힌다. includeBuild 로 묶인 모듈의
# 파일은 무시되므로, 그 모듈 폴더에서 직접 돌리는 경우(cd src/backend/<모듈> && ../gradlew …)를 위해 같은 값을 둔다.
#
# caching: 로컬 빌드 캐시(~/.gradle/caches/build-cache-1)를 켠다. 워크트리가 달라도 입력이 같으면 컴파일 결과를 재사용한다.
#          Test 태스크는 build-logic 의 dmes.test-conventions 플러그인(모듈 루트 build.gradle 이 적용)에서 캐시에서 뺐다(선언되지 않은 외부 입력 — 작업 트리 밖 파일·로컬 Oracle 시험 PDB).
# workers.max: 빌드 하나가 동시에 쓰는 워커(컴파일·테스트 fork 등) 상한. 기본값은 코어 수(10)다.
# daemon.idletimeout: 쉬는 데몬을 10분 뒤 내린다(기본 3시간). 워크트리마다 남는 데몬의 메모리를 줄인다.
org.gradle.caching=true
org.gradle.workers.max=3
org.gradle.daemon.idletimeout=600000

org.gradle.console=verbose
org.gradle.jvmargs=-Xmx1024m
