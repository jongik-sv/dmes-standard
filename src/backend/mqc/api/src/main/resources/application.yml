server:
  port: 8093

spring:
  application:
    name: mqc
  datasource:
    url: jdbc:sqlite:../data/mqc.db
    driver-class-name: org.sqlite.JDBC
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect
  flyway:
    enabled: true
    # ⚠️ locations 는 반드시 자기 아티팩트 폴더로 좁힌다.
    #    모든 호스트 모듈이 mcm-core(공유 라이브러리)를 classpath 에 물고 있어서,
    #    `classpath:db/migration` 처럼 넓게 잡으면 라이브러리가 실은 V*.sql 과
    #    버전 번호가 겹쳐 "Found more than one migration with version 1" 로 부팅이 죽는다.
    #    라이브러리 마이그레이션을 함께 적용하려면 그 아티팩트 폴더를 명시적으로 더한다.
    #    예) locations: classpath:db/migration/mqc,classpath:db/migration/aps-core
    locations: classpath:db/migration/mqc

# 실 프로젝트의 데이터소스(JNDI·다중 DB)·보안 설정은 docs/framework/, docs/cactus/ 의
# 패턴을 따른다. 위 설정은 bootRun 으로 골격을 띄우기 위한 최소 구성이다.

# ── MDM 메타 캐시(spec docs/superpowers/specs/2026-10-02-mdm-meta-cache-design.md §5.1) ──
#  MDM(8096)에서 컬럼·도메인·룰·룰세트·코드·전문 정의를 받아 이 인스턴스에 캐시하고 10초마다 변경 기록을 확인한다.
#  끄려면 MDM_CACHE_ENABLED=false. client-key 는 MDM 이 받는 BACKEND_CLIENT_KEY 와 같아야 한다.
#   이 모듈에는 cactus.oasis.service-group 이 없어 module 을 직접 둔다.
cactus:
  mdm:
    enabled: ${MDM_CACHE_ENABLED:true}
    module: mqc
    base-url: ${MDM_WAS_URL:http://localhost:8096}
    client-key: ${BACKEND_CLIENT_KEY:dmes-bff-local-client-key-2026}
    poll-interval: 10s
    max-entries: 20000
    max-age: 60m
    connect-timeout: 2s
    read-timeout: 5s
