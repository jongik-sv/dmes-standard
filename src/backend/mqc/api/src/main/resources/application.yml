server:
  port: 8093

spring:
  application:
    name: mqc
  # Oracle(oracle-1007) — 접속값은 DMES_ORA_* 로 덮어쓴다(docs/oracle-1007/schema-owners.md §3). 접속 사용자 = 스키마 주인(MQCAPUSER).
  datasource:
    url: ${DMES_ORA_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
    username: ${DMES_ORA_USER:MQCAPUSER}
    password: ${DMES_ORA_PASSWORD:dmes_password_123}
    hikari:
      maximum-pool-size: 3     # Oracle 인스턴스를 모든 레인이 공유한다
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        # 감사 칸(Instant)은 TIMESTAMP(6) 로 저장한다. 시각은 KST 통일이라 hibernate.jdbc.time_zone 은 넣지 않는다(JVM Asia/Seoul).
        type.preferred_instant_jdbc_type: TIMESTAMP
        type.preferred_boolean_jdbc_type: TINYINT   # boolean 칸은 NUMBER(1,0)+CHECK(0,1) — BIT 는 Oracle 23+ 에서 validate 가 실패한다
        # SQL 로그를 mcm 처럼 여러 줄로 찍는다. 서식만 바꾸며 로그 수준은 application-local.yml 이 정한다(운영은 SQL 로그 꺼짐).
        format_sql: true
  flyway:
    enabled: true
    # ⚠️ locations 는 반드시 자기 아티팩트 폴더로 좁힌다.
    #    모든 호스트 모듈이 mcm-core(공유 라이브러리)를 classpath 에 물고 있어서,
    #    `classpath:db/migration` 처럼 넓게 잡으면 라이브러리가 실은 V*.sql 과
    #    버전 번호가 겹쳐 "Found more than one migration with version 1" 로 부팅이 죽는다.
    #    라이브러리 마이그레이션을 함께 적용하려면 그 아티팩트 폴더를 명시적으로 더한다.
    #    예) locations: classpath:db/migration/mqc,classpath:db/migration/aps-core
    locations: classpath:db/migration/mqc

# 실 프로젝트의 데이터소스(JNDI·다중 DB)·보안 설정은 docs/framework/, docs/cactus/ 의
# 패턴을 따른다. 위 설정은 bootRun 으로 골격을 띄우기 위한 최소 구성이다.

# ---------------------------------------------------------------------------
# Cactus 보안·OASIS — MDM 메타 캐시 엔드포인트(/api/mqc/mdmMeta/*)를 BFF 로 부를 수 있게 신설 (2026-10-02)
# ---------------------------------------------------------------------------
# mls(src/backend/mls/api/src/main/resources/application.yml) 선례 그대로다. 이 블록이 없으면:
#   cactus.jwt.secret 이 없어 CactusWebSecurityAutoConfiguration 이 꺼지고 Spring Security 기본 체인(Basic, 전 요청 인증)이 걸려
#   BFF 호출이 모두 401 이 된다. 포털 apiRequest 는 401 이면 로그인으로 보내므로 MDM 캐시 관리 화면을 열면 관리자가 로그아웃됐다
#   (Task 14 결함 D2). 이 모듈은 로그인을 호스팅하지 않는다 — 토큰 발급 주체는 mcm 이고 cactus.auth.enabled 는 켜지 않는다.
#   cactus.security     — BFF(be-proxy) 가 붙이는 X-Client-Key 를 검증한다. ClientKeyFilter 가 X-Authenticated-User / X-Authenticated-Role
#                         헤더로 SecurityContext 를 사전 인증 set 한다. 키가 틀리거나 없으면 401 A001.
#   cactus.oasis        — service-group 은 /api/{module}/mdmMeta 의 module 이기도 하다(cactus.mdm.module 이 비면 이 값).
# ── MDM 메타 캐시(spec docs/superpowers/specs/2026-10-02-mdm-meta-cache-design.md §5.1) ──
#  MDM(8096)에서 컬럼·도메인·룰·룰세트·코드·전문 정의를 받아 이 인스턴스에 캐시하고 10초마다 변경 기록을 확인한다.
#  끄려면 MDM_CACHE_ENABLED=false. client-key 는 MDM 이 받는 BACKEND_CLIENT_KEY 와 같아야 한다.
cactus:
  jwt:
    secret: ${CACTUS_JWT_SECRET:Y2FjdHVzLXNhbXBsZS1zZWNyZXQta2V5LWZvci10ZXN0aW5nLW9ubHktMjAyNg==}
    issuer: mqc
  security:
    client-key: ${BACKEND_CLIENT_KEY:dmes-bff-local-client-key-2026}
    # ⚠️ override 시 default 3종이 통째로 대체되므로 전부 나열한다 (ClientKeyFilter.java:85-87).
    # @Value 플레이스홀더 바인딩이라 YAML 리스트 불가 — 콤마 문자열로 기재.
    client-key-skip-paths: /auth/,/api/auth/,/actuator/
  oasis:
    service-group: mqc
    service-path: /services
    transactional: true   # 예약 작업(jobQuery DML·업무 BPMN)이 서비스 단위 트랜잭션으로 돈다. mcm·mdm·mls 와 같다.
  mdm:
    enabled: ${MDM_CACHE_ENABLED:true}
    module: mqc
    system-code: MES      # 컬럼 별칭 매칭에 쓰는 MDM 시스템 코드(표준 물리명으로 못 찾으면 이 시스템의 별칭으로 찾는다)
    base-url: ${MDM_WAS_URL:http://localhost:8096}
    client-key: ${BACKEND_CLIENT_KEY:dmes-bff-local-client-key-2026}
    poll-interval: 10s
    max-entries: 20000
    max-age: 24h         # 적재 뒤 절대 상한 — 조회가 많아도 이 시간 뒤에는 MDM 에서 다시 받는다
    max-idle: 60m        # 마지막 조회 뒤 이 시간 동안 조회가 없으면 만료(조회될 때마다 연장)
    connect-timeout: 2s
    read-timeout: 5s

# ── 예약 작업(docs/superpowers/specs/2026-10-08-job-scheduler-design.md §4.7) ──
# 이 앱은 MCM 이 푸시하는 실행을 접수(POST /internal/job/run)하고 결과를 DB 에 직접 쓴다. 판정·호출 설정(server·modules)은 MCM 만 둔다.
# schema(기본 MCMAPUSER)·pool-size(기본 4)·agent.enabled(기본 true) 는 기본값을 쓴다.
dmes:
  job:
    module: mqc
