plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'com.dongkuk.dmes'
version = '0.1.0-SNAPSHOT'

repositories {
    mavenCentral()
    // 사내 전용 라이브러리 저장소가 있다면 여기에 추가
    // maven {
    //     url = 'https://your-internal-nexus/repository/maven-public/'
    //     content {
    //         includeGroup 'com.dongkuk'
    //         includeGroup 'com.dongkuk.dmes'
    //     }
    // }
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.add('-parameters')
}

tasks.named('test') {
    useJUnitPlatform()
}

dependencies {
    api platform('org.springframework.boot:spring-boot-dependencies:4.0.6')

    compileOnly 'org.springframework.boot:spring-boot-starter-data-jpa'
    compileOnly 'org.springframework.boot:spring-boot-starter-webmvc'
    compileOnly 'org.springframework.boot:spring-boot-starter-security'
    compileOnly 'org.springframework.boot:spring-boot-starter-validation'

    api 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.14'
    api 'org.mapstruct:mapstruct:1.6.3'
    api 'com.fasterxml.jackson.core:jackson-databind'
    api 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

    compileOnly 'org.flywaydb:flyway-core'

    annotationProcessor platform('org.springframework.boot:spring-boot-dependencies:4.0.6')
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'
    annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation'
    testRuntimeOnly 'org.xerial:sqlite-jdbc:3.45.3.0'
    testImplementation 'org.hibernate.orm:hibernate-community-dialects:7.0.5.Final'
    testImplementation 'org.flywaydb:flyway-core'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

