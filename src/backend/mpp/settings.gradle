// 백엔드 빌드 관례 플러그인(dmes.*, src/backend/build-logic) — Gradle 규칙상 pluginManagement 는 settings 맨 앞이어야 한다.
pluginManagement {
    includeBuild('../build-logic')
}

rootProject.name = 'mpp'

// 백엔드 공용 버전 카탈로그 — 이 폴더엔 gradle/libs.versions.toml 이 없어 자동으로 읽히지 않으므로 직접 가져온다.
dependencyResolutionManagement {
    versionCatalogs {
        libs {
            from(files('../gradle/libs.versions.toml'))
        }
    }
}

// 이웃 모듈 included build — dmesIncludeBuild(경로, 좌표) 는 includeBuild + dependencySubstitution(좌표 → 그 빌드 루트) 이다.
apply from: '../gradle/include-builds.settings.gradle'

dmesIncludeBuild('../cactus-core', 'com.dongkuk.dmes:cactus-core')
dmesIncludeBuild('../mcm-core', 'com.dongkuk.dmes:mcm-core')

// MDM 메타 캐시(2026-10-02) — cactus-core 가 maru-mdm-engine 을 api 로 문다. 중첩 includeBuild 전달에 기대지 않고
// mdm/settings.gradle 과 같이 명시한다(Task 0 실측은 커밋 메시지 참고).
dmesIncludeBuild('../maru-mdm-engine', 'kr.dongkuk.maru.mdm:maru-mdm-engine')

include 'lib'
include 'api'
