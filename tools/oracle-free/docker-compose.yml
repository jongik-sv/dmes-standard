# 로컬 Oracle 26ai Free — docs/guide/Database/oracle-26ai-test-guide.md §5
# Podman compose 용(이 PC 의 실행 방식은 Podman VM). Oracle 컨테이너 하나만 도커 금지 규칙의 예외이고 그 밖의 도커 사용은 막혀 있다.
services:
  oracle-db:
    image: docker.io/gvenzl/oracle-free:slim-faststart
    container_name: oracle-26ai-free
    ports:
      - "1521:1521"
    environment:
      # 컨테이너 OS 시간대를 KST 로 둔다(SYSDATE·SYSTIMESTAMP 가 KST). 감사 시각을 KST 로 통일한 결정(oracle-1007)
      TZ: "Asia/Seoul"
      ORACLE_PASSWORD: "sys_password_123"
      APP_USER: "dmes_user"
      APP_USER_PASSWORD: "dmes_password_123"
    volumes:
      - oracle-data:/opt/oracle/oradata:Z
      # - ./init-scripts:/container-entrypoint-initdb.d

volumes:
  oracle-data:
